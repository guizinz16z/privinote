<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Privinote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg-dark: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  --bg-light: linear-gradient(135deg,#f5f7fa,#c3cfe2);
  --box-dark: rgba(0,0,0,.65);
  --box-light: rgba(255,255,255,.92);
  --text-dark:#fff;
  --text-light:#111;
  --accent:#00c6ff;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg-dark);
  color:var(--text-dark);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

.box{
  background:var(--box-dark);
  padding:26px;
  border-radius:20px;
  max-width:440px;
  width:100%;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.45);
}

body.light .box{background:var(--box-light);}

textarea{
  width:100%;
  height:120px;
  border-radius:14px;
  border:none;
  padding:14px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
}

.secondary{background:#444}

.link{
  word-break:break-all;
  font-size:14px;
  color:#00ffcc;
  margin-top:12px;
}

.top-controls{
  position:fixed;
  top:15px;
  right:15px;
}

.top-controls button{
  padding:8px 12px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="top-controls">
  <button onclick="toggleTheme()">🌓</button>
</div>

<div class="box" id="app"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBHOFAcNcQ-397zebLS_n0G8M4meM7hVq8",
  authDomain:"privinote.firebaseapp.com",
  projectId:"privinote"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const params=new URLSearchParams(location.search);
const noteId=params.get("id");
const appBox=document.getElementById("app");

/* ===== QUEBRAR NOTA ===== */
if(noteId){
  appBox.innerHTML=`
    <h2>🔓 Quebrar nota</h2>
    <button id="open">Quebrar nota</button>
    <button class="secondary" onclick="goHome()">🔙 Criar nova nota</button>
  `;

  document.getElementById("open").onclick=async()=>{
    const ref=doc(db,"notes",noteId);
    const snap=await getDoc(ref);

    if(!snap.exists()){
      appBox.innerHTML=`
        <h2>❌ Nota inexistente ou já quebrada</h2>
        <button onclick="goHome()">🔙 Criar nova nota</button>
      `;
      return;
    }

    const {text}=snap.data();
    await deleteDoc(ref);

    appBox.innerHTML=`
      <h2>💥 Nota quebrada</h2>
      <div style="margin-top:12px;font-size:18px">${text}</div>
      <p style="margin-top:14px;opacity:.7">Essa nota foi destruída.</p>
      <button onclick="goHome()">🔙 Criar nova nota</button>
    `;
  };

}
/* ===== CRIAR NOTA ===== */
else{
  appBox.innerHTML=`
    <h2>🔐 Criar mensagem secreta</h2>
    <textarea id="text" placeholder="Digite sua mensagem secreta..."></textarea>
    <button id="create">Criar link secreto</button>
    <div id="linkBox" style="display:none">
      <div class="link" id="result"></div>
    </div>
    <p style="margin-top:12px;font-size:12px;opacity:.6">
      Criado por <a href="https://t.me/Guizin16z" target="_blank">@Guizin16z</a>
    </p>
  `;

  document.getElementById("create").onclick=async()=>{
    const text=document.getElementById("text").value.trim();
    if(!text) return alert("Digite algo");

    const id=Math.random().toString(36).slice(2,10);
    await setDoc(doc(db,"notes",id),{text});

    const link=`${location.origin}${location.pathname}?id=${id}`;
    document.getElementById("result").innerText=link;
    document.getElementById("linkBox").style.display="block";
  };
}

/* ===== UTIL ===== */
window.goHome=()=>{
  location.href=location.pathname;
};

window.toggleTheme=()=>{
  document.body.classList.toggle("light");
};
</script>

</body>
</html>
