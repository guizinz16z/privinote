<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Privinote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg-dark: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  --bg-light: linear-gradient(135deg,#f5f7fa,#c3cfe2);
  --box-dark: rgba(0,0,0,.65);
  --box-light: rgba(255,255,255,.92);
  --text-dark:#fff;
  --text-light:#111;
  --accent:#00c6ff;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:16px;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg-dark);
  color:var(--text-dark);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.4s;
}

body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

.box{
  background:var(--box-dark);
  padding:26px;
  border-radius:20px;
  max-width:440px;
  width:100%;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.45);
  animation:slide .5s ease;
}

body.light .box{background:var(--box-light);}

@keyframes slide{
  from{transform:translateY(30px);opacity:0}
  to{transform:none;opacity:1}
}

textarea{
  width:100%;
  height:120px;
  border-radius:14px;
  border:none;
  padding:14px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
  transition:.25s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.danger{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  font-weight:bold;
}

.copy-btn{
  background:#00ffcc;
  color:#000;
  font-weight:bold;
}

.link{
  word-break:break-all;
  font-size:14px;
  color:#00ffcc;
  margin-top:12px;
}

.footer{
  margin-top:18px;
  font-size:12px;
  opacity:.75;
}

.footer a{color:var(--accent);text-decoration:none;font-weight:bold}

.legal{font-size:11px;opacity:.55;margin-top:6px}

.top-controls{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  gap:8px;
}

.top-controls button{
  width:auto;
  padding:8px 12px;
  font-size:14px;
  border-radius:10px;
}

.flash{
  position:fixed;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

.flash.active{animation:flash .5s}

@keyframes flash{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

.time{
  margin-top:12px;
  font-size:13px;
  opacity:.75;
}

/* ======= ADICIONADO (animações) ======= */

/* Transições suaves do box (tela) */
.box{
  transform: translateY(10px);
  opacity: 0;
  transition: transform .35s ease, opacity .35s ease;
  will-change: transform, opacity;
}
.box.show{
  transform: translateY(0);
  opacity: 1;
}

/* Botões com “press” melhor + ripple simples */
button{
  position: relative;
  overflow: hidden;
}
button:active{ transform: scale(.98); }

button::after{
  content:"";
  position:absolute;
  width:10px;height:10px;
  left:50%;top:50%;
  transform:translate(-50%,-50%) scale(1);
  background: rgba(255,255,255,.35);
  border-radius:999px;
  opacity:0;
  pointer-events:none;
}
button.ripple::after{
  animation:ripple .55s ease-out;
}
@keyframes ripple{
  0%{ opacity:.55; transform:translate(-50%,-50%) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(26); }
}

/* Shake quando tentar criar nota vazia */
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-8px); }
  40%{ transform:translateX(8px); }
  60%{ transform:translateX(-6px); }
  80%{ transform:translateX(6px); }
}
.shake{ animation: shake .35s ease; }

/* Fade/slide para a mensagem aparecer */
@keyframes reveal{
  from{ opacity:0; transform: translateY(10px); }
  to{ opacity:1; transform: translateY(0); }
}
.reveal{ animation: reveal .35s ease; }

/* Respeitar acessibilidade */
@media (prefers-reduced-motion: reduce){
  .box, .box.show, .reveal, .shake, button.ripple::after{
    animation:none !important;
    transition:none !important;
  }
}
</style>
</head>

<body>

<div class="top-controls">
  <button onclick="toggleTheme()">🌓</button>
  <button onclick="toggleLang()">🌐</button>
</div>

<div class="flash" id="flash"></div>

<!-- CREATE -->
<div class="box" id="create">
  <h2 id="t_create">🔐 Criar mensagem secreta</h2>
  <textarea id="text" placeholder=""></textarea>
  <button onclick="createNote()" id="t_create_btn"></button>

  <div id="linkBox" style="display:none">
    <div class="link" id="result"></div>
    <button class="copy-btn" onclick="copyLink()" id="t_copy"></button>
  </div>

  <div class="footer">
    <span id="t_created"></span>
    <a href="https://t.me/Guizin16z" target="_blank">@Guizin16z</a>
    <div class="legal" id="t_legal"></div>
  </div>
</div>

<!-- BREAK -->
<div class="box" id="breaker" style="display:none">
  <h2 id="t_protected"></h2>
  <p id="t_warning"></p>
  <button class="danger" onclick="breakNote()" id="t_break"></button>
  <button onclick="goCreate()" id="t_new"></button>
</div>

<!-- VIEW -->
<div class="box" id="view" style="display:none">
  <h2 id="t_message"></h2>

  <!-- TROQUEI P -> DIV (melhor pra HTML) -->
  <div id="message"></div>

  <div class="time" id="destroyTime"></div>
  <button onclick="goCreate()" id="t_new2"></button>
</div>

<!-- DOMPurify (para HTML seguro) -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,doc,setDoc,getDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBHOFAcNcQ-397zebLS_n0G8M4meM7hVq8",
  authDomain:"privinote.firebaseapp.com",
  projectId:"privinote",
  storageBucket:"privinote.firebasestorage.app",
  messagingSenderId:"583662739248",
  appId:"1:583662739248:web:ba624aa2e0cd070a0272f5"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const texts={
  pt:{
    create:"🔐 Criar mensagem secreta",
    placeholder:"Digite sua mensagem secreta... (pode usar HTML: <b>, <i>, <a>, <img>)",
    createBtn:"Criar link secreto",
    copy:"📋 Copiar link",
    created:"Criado por ",
    legal:"Não utilize para atividades ilegais.",
    protected:"⚠️ Mensagem protegida",
    warning:"Ao quebrar, a mensagem será destruída.",
    break:"💣 Quebrar nota",
    new:"➕ Criar nova nota",
    msg:"📩 Mensagem secreta",
    destroyed:"🕒 Nota destruída em: "
  },
  en:{
    create:"🔐 Create secret message",
    placeholder:"Type your secret message... (HTML allowed: <b>, <i>, <a>, <img>)",
    createBtn:"Create secret link",
    copy:"📋 Copy link",
    created:"Created by ",
    legal:"Do not use for illegal activities.",
    protected:"⚠️ Protected message",
    warning:"Once broken, the message will be destroyed.",
    break:"💣 Break note",
    new:"➕ Create new note",
    msg:"📩 Secret message",
    destroyed:"🕒 Note destroyed at: "
  }
};

let lang=localStorage.getItem("lang")||"pt";

function applyLang(){
  const t=texts[lang];
  document.getElementById("t_create").innerText=t.create;
  document.getElementById("text").placeholder=t.placeholder;
  document.getElementById("t_create_btn").innerText=t.createBtn;
  document.getElementById("t_copy").innerText=t.copy;
  document.getElementById("t_created").innerText=t.created;
  document.getElementById("t_legal").innerText=t.legal;
  document.getElementById("t_protected").innerText=t.protected;
  document.getElementById("t_warning").innerText=t.warning;
  document.getElementById("t_break").innerText=t.break;
  document.getElementById("t_new").innerText=t.new;
  document.getElementById("t_new2").innerText=t.new;
  document.getElementById("t_message").innerText=t.msg;
}
applyLang();

window.toggleLang=()=>{
  lang=lang==="pt"?"en":"pt";
  localStorage.setItem("lang",lang);
  applyLang();
};

window.toggleTheme=()=>{
  document.body.classList.toggle("light");
  localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark");
};
if(localStorage.getItem("theme")==="light")document.body.classList.add("light");

const params=new URLSearchParams(location.search);
const id=params.get("id");
const create=document.getElementById("create");
const breaker=document.getElementById("breaker");
const view=document.getElementById("view");
const msg=document.getElementById("message");
const timeEl=document.getElementById("destroyTime");
const flash=document.getElementById("flash");

/* ======= ADICIONADO (JS de animação) ======= */
function showBox(el){
  [create, breaker, view].forEach(b=>{
    b.classList.remove("show");
    b.style.display="none";
  });
  el.style.display="block";
  requestAnimationFrame(()=> el.classList.add("show"));
}

// Ripple em todos os botões
document.querySelectorAll("button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    btn.classList.remove("ripple");
    void btn.offsetWidth; // reinicia animação
    btn.classList.add("ripple");
  });
});
/* ======= /ADICIONADO ======= */

if(id){
  showBox(breaker);
}else{
  showBox(create);
}

function formatDate(ts){
  const d=new Date(ts);
  return d.toLocaleDateString()+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}

window.breakNote=async()=>{
  flash.classList.add("active");
  setTimeout(async()=>{
    showBox(view);
    msg.classList.add("reveal");
    flash.classList.remove("active");

    const ref=doc(db,"notes",id);
    const snap=await getDoc(ref);
    const now=Date.now();

    if(!snap.exists()){
      msg.innerText="❌";
      timeEl.innerText="";
    }else{
      const raw = snap.data().text || "";

      // HTML renderizado com segurança (DOMPurify)
      msg.innerHTML = DOMPurify.sanitize(raw, {
        USE_PROFILES: { html: true },
        ALLOWED_TAGS: [
          "b","strong","i","em","u","s",
          "p","br","hr","blockquote",
          "h1","h2","h3","h4",
          "ul","ol","li",
          "a","span","div",
          "img"
        ],
        ALLOWED_ATTR: [
          "href","title","target","rel",
          "src","alt","width","height",
          "style","loading","referrerpolicy"
        ]
      });

      timeEl.innerText=texts[lang].destroyed+formatDate(now);
      await deleteDoc(ref);
    }
  },500);
};

window.createNote=async()=>{
  const text=document.getElementById("text").value.trim();

  /* ======= ADICIONADO (shake se vazio) ======= */
  if(!text){
    create.classList.remove("shake");
    void create.offsetWidth;
    create.classList.add("shake");
    return;
  }
  /* ======= /ADICIONADO ======= */

  const id=Math.random().toString(36).substring(2,10);
  await setDoc(doc(db,"notes",id),{text,createdAt:Date.now()});
  document.getElementById("result").innerText=`${location.origin}${location.pathname}?id=${id}`;
  document.getElementById("linkBox").style.display="block";
};

window.copyLink=()=>{
  const resultEl = document.getElementById("result");
  navigator.clipboard.writeText(resultEl.innerText);
};

window.goCreate=()=>location.href=location.pathname;
</script>

</body>
</html>
