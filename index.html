<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Privinote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg-dark:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  --bg-light:linear-gradient(135deg,#f5f7fa,#c3cfe2);
  --box-dark:rgba(0,0,0,.65);
  --box-light:rgba(255,255,255,.9);
  --text-dark:#fff;
  --text-light:#000;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg-dark);
  color:var(--text-dark);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.4s;
}

body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

.box{
  background:var(--box-dark);
  padding:24px;
  border-radius:16px;
  max-width:420px;
  width:100%;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
  animation:fade .5s ease;
}

body.light .box{background:var(--box-light);}

@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1}
}

textarea,input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
  margin-top:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
}

button.alt{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
}

.footer{
  margin-top:14px;
  font-size:12px;
  opacity:.7;
}

.footer a{color:#00c6ff;text-decoration:none}

/* TOGGLE */
.toggle{
  position:fixed;
  top:15px;
  right:15px;
  background:none;
  border:none;
  font-size:20px;
  cursor:pointer;
}

/* PRÊMIO */
.prize-img{
  width:140px;
  height:140px;
  border-radius:50%;
  border:4px solid #fff;
  object-fit:cover;
  margin:15px auto;
  box-shadow:0 0 20px rgba(0,0,0,.3);
}

.confetti{
  position:fixed;
  width:8px;
  height:8px;
  animation:fall linear infinite;
}

@keyframes fall{
  from{transform:translateY(-10vh)}
  to{transform:translateY(110vh)}
}
</style>
</head>
<body>

<button class="toggle" onclick="toggleTheme()">🌙</button>

<!-- CRIAR -->
<div class="box" id="create">
<h2>🔐 Criar nota</h2>

<textarea id="text" placeholder="Mensagem secreta"></textarea>

<input id="img" placeholder="URL da imagem (modo prêmio)">
<input id="btn" placeholder="Link do botão (Telegram)">

<button onclick="createNote()">Criar nota normal</button>
<button class="alt" onclick="createPrize()">Criar nota prêmio</button>

<div class="footer">
Criado por <a href="https://t.me/Guizin16z" target="_blank">@Guizin16z</a>
</div>
</div>

<!-- VIEW -->
<div class="box" id="view" style="display:none"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,doc,setDoc,getDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBHOFAcNcQ-397zebLS_n0G8M4meM7hVq8",
authDomain:"privinote.firebaseapp.com",
projectId:"privinote",
storageBucket:"privinote.firebasestorage.app",
messagingSenderId:"583662739248",
appId:"1:583662739248:web:ba624aa2e0cd070a0272f5"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const params=new URLSearchParams(location.search);
const id=params.get("id");

const create=document.getElementById("create");
const view=document.getElementById("view");

if(id){
create.style.display="none";
view.style.display="block";

const ref=doc(db,"notes",id);
const snap=await getDoc(ref);

if(!snap.exists()){
view.innerHTML="❌ Nota destruída";
}else{
const d=snap.data();

if(d.type==="prize"){
view.innerHTML=`
<h2>🎉 Você ganhou!</h2>
<img src="${d.image}" class="prize-img">
<p>${d.text}</p>
<a href="${d.button}" target="_blank">
<button>Resgatar prêmio</button>
</a>
`;
confetti();
}else{
view.innerHTML=`<p>${d.text}</p>`;
}

await deleteDoc(ref);
}
}

function confetti(){
for(let i=0;i<80;i++){
const c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff0","#0ff","#f0f","#0f0","#fff"][Math.floor(Math.random()*5)];
c.style.animationDuration=(Math.random()*3+2)+"s";
document.body.appendChild(c);
}
}

window.createNote=async()=>{
const text=document.getElementById("text").value;
const id=Math.random().toString(36).slice(2,10);
await setDoc(doc(db,"notes",id),{type:"text",text});
alert("Link: "+location.origin+location.pathname+"?id="+id);
}

window.createPrize=async()=>{
const id=Math.random().toString(36).slice(2,10);
await setDoc(doc(db,"notes",id),{
type:"prize",
text:document.getElementById("text").value,
image:document.getElementById("img").value,
button:document.getElementById("btn").value
});
alert("Link: "+location.origin+location.pathname+"?id="+id);
}

// THEME
function toggleTheme(){
document.body.classList.toggle("light");
localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark");
}
if(localStorage.getItem("theme")==="light")document.body.classList.add("light");
</script>

</body>
</html>
