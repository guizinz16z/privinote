<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Privinote — Mensagens secretas que se autodestroem</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Crie mensagens secretas com link único que se autodestroem após serem lidas. Proteja com senha, defina tempo de expiração e compartilhe com segurança.">
<meta name="author" content="Guizin16z">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Privinote — Mensagens que se autodestroem 🔐">
<meta property="og:description" content="Crie um link secreto com sua mensagem. Ela expira ou se autodestrói após ser lida. Grátis e sem cadastro.">
<meta property="og:url" content="https://notexxz.netlify.app/">
<meta property="og:site_name" content="Privinote">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<!-- só as weights que realmente usamos -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060b14;--sf:rgba(8,18,36,.88);
  --b:rgba(0,210,255,.18);--bh:rgba(0,210,255,.55);
  --n:#00d2ff;--n2:#00ff9d;--n3:#ff2d6e;
  --ng:rgba(0,210,255,.28);
  --t:#e2f0ff;--td:rgba(226,240,255,.45);
  --fd:'Orbitron',sans-serif;--fm:'Share Tech Mono',monospace;--fb:'Inter',sans-serif;
  --r:14px;--rs:10px;
}
body.light{
  --bg:#f0f4fa;--sf:rgba(255,255,255,.93);
  --b:rgba(0,100,190,.18);--bh:rgba(0,100,190,.5);
  --n:#006fc2;--n2:#009a60;--n3:#d4003a;
  --ng:rgba(0,111,194,.18);
  --t:#0a1628;--td:rgba(10,22,40,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--fb);background:var(--bg);color:var(--t);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:16px;transition:background .35s,color .35s;overflow-x:hidden;
}
#rain{position:fixed;inset:0;pointer-events:none;z-index:0}
/* card */
.box{
  position:relative;z-index:2;background:var(--sf);border:1px solid var(--b);
  border-radius:var(--r);padding:26px 24px;max-width:448px;width:100%;
  text-align:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 0 0 1px var(--b),0 0 50px rgba(0,210,255,.05),0 24px 60px rgba(0,0,0,.55);
  opacity:0;transform:translateY(14px);transition:opacity .38s ease,transform .38s ease,border-color .25s,box-shadow .25s;
}
.box.show{opacity:1;transform:none}
.box:hover{border-color:var(--bh);box-shadow:0 0 0 1px var(--bh),0 0 60px rgba(0,210,255,.09),0 24px 60px rgba(0,0,0,.55)}
/* logo */
.logo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:18px}
.logo-icon{font-size:23px;animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 5px var(--n))}50%{filter:drop-shadow(0 0 13px var(--n))}}
.logo-text{
  font-family:var(--fd);font-size:19px;font-weight:900;letter-spacing:4px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--n),var(--n2));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
}
h2{font-family:var(--fm);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--td);margin-bottom:14px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--bh),transparent);margin:14px 0}
/* textarea */
.tw{position:relative}
textarea{
  width:100%;height:116px;background:rgba(0,0,0,.3);border:1px solid var(--b);border-radius:var(--rs);
  padding:12px 12px 28px;font-family:var(--fb);font-size:15px;color:var(--t);
  outline:none;resize:none;transition:border-color .2s,box-shadow .2s;
}
body.light textarea{background:rgba(255,255,255,.6)}
textarea::placeholder{color:var(--td)}
textarea:focus{border-color:var(--n);box-shadow:0 0 0 3px var(--ng)}
.cc{
  position:absolute;bottom:8px;right:10px;
  font-family:var(--fm);font-size:10.5px;color:var(--td);pointer-events:none;transition:color .2s;
}
.cc.w{color:#ffb347}.cc.d{color:var(--n3)}
/* options */
.opts{text-align:left;margin-top:12px;display:flex;flex-direction:column;gap:9px}
.lbl{display:block;font-family:var(--fm);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--n);margin-bottom:4px}
select,input[type=password]{
  width:100%;padding:10px 12px;background:rgba(0,0,0,.28);border:1px solid var(--b);
  border-radius:var(--rs);color:var(--t);font-family:var(--fb);font-size:14px;
  outline:none;appearance:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s;
}
body.light select,body.light input[type=password]{background:rgba(255,255,255,.65)}
select:focus,input[type=password]:focus{border-color:var(--n);box-shadow:0 0 0 3px var(--ng)}
select option{background:#0a1628;color:var(--t)}
/* toggle row */
.tr{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:rgba(0,210,255,.04);border:1px solid var(--b);border-radius:var(--rs);
  cursor:pointer;transition:border-color .2s,background .2s;user-select:none;
}
.tr:hover{border-color:var(--bh);background:rgba(0,210,255,.08)}
.tr span{font-size:13px;color:var(--t);flex:1}
input[type=checkbox]{
  appearance:none;-webkit-appearance:none;width:17px;height:17px;flex-shrink:0;
  border:1.5px solid var(--bh);border-radius:5px;background:transparent;
  cursor:pointer;position:relative;transition:background .18s,border-color .18s;
}
input[type=checkbox]:checked{background:var(--n);border-color:var(--n)}
input[type=checkbox]:checked::after{
  content:'';position:absolute;left:4px;top:1px;
  width:5px;height:10px;border:2px solid #000;border-top:none;border-left:none;transform:rotate(45deg);
}
/* buttons */
button{
  width:100%;padding:12px 16px;border:none;border-radius:var(--rs);
  font-family:var(--fb);font-size:14px;font-weight:600;cursor:pointer;
  position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;letter-spacing:.4px;
}
button:active{transform:scale(.97)!important}
button::after{
  content:'';position:absolute;width:10px;height:10px;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(1);background:rgba(255,255,255,.28);
  border-radius:999px;opacity:0;pointer-events:none;
}
button.rpl::after{animation:rpl .46s ease-out}
@keyframes rpl{0%{opacity:.5;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(28)}}
.bp{
  background:linear-gradient(135deg,var(--n),#0072ff);color:#000;font-weight:700;
  margin-top:12px;font-family:var(--fd);font-size:10.5px;letter-spacing:2.5px;
  text-transform:uppercase;box-shadow:0 0 20px rgba(0,210,255,.25);
}
.bp:hover{box-shadow:0 0 36px rgba(0,210,255,.48);transform:translateY(-1px)}
.bd{
  background:linear-gradient(135deg,var(--n3),#ff7a00);color:#fff;font-weight:700;
  margin-top:12px;font-family:var(--fd);font-size:10.5px;letter-spacing:2.5px;
  text-transform:uppercase;box-shadow:0 0 20px rgba(255,45,110,.25);
}
.bd:hover{box-shadow:0 0 36px rgba(255,45,110,.48);transform:translateY(-1px)}
.bg{background:transparent;border:1px solid var(--b);color:var(--td);margin-top:8px;font-size:13px}
.bg:hover{border-color:var(--bh);color:var(--t);background:rgba(0,210,255,.05)}
/* action grid */
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}
.acts button{margin:0;padding:10px 6px;font-size:11.5px;border-radius:var(--rs)}
.bc{background:rgba(0,255,157,.08);border:1px solid rgba(0,255,157,.25);color:var(--n2)}
.bc:hover{background:rgba(0,255,157,.18);border-color:var(--n2)}
.bs{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.25);color:var(--n)}
.bs:hover{background:rgba(0,210,255,.18);border-color:var(--n)}
.bpv{background:rgba(255,180,50,.07);border:1px solid rgba(255,180,50,.25);color:#ffb432}
.bpv:hover{background:rgba(255,180,50,.18);border-color:#ffb432}
/* link */
.lr{margin-top:12px;padding:10px 12px;background:rgba(0,255,157,.05);border:1px solid rgba(0,255,157,.18);border-radius:var(--rs)}
.lk{font-family:var(--fm);font-size:11px;color:var(--n2);word-break:break-all;line-height:1.6}
/* top controls */
.tc{position:fixed!important;top:13px!important;right:13px!important;left:auto!important;bottom:auto!important;z-index:9999!important;display:flex;gap:6px}
.tc button{width:auto;padding:6px 11px;font-size:14px;border-radius:8px;margin:0;background:rgba(0,0,0,.48);border:1px solid var(--b);color:var(--t);backdrop-filter:blur(10px)}
body.light .tc button{background:rgba(255,255,255,.75)}
.tc button:hover{border-color:var(--bh);background:rgba(0,210,255,.1)}
/* status */
.fs{position:fixed;left:13px;bottom:13px;z-index:9999}
.sp{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-family:var(--fm);font-size:11px;color:var(--td);border:1px solid var(--b);background:rgba(0,0,0,.4);backdrop-filter:blur(12px)}
body.light .sp{background:rgba(255,255,255,.78)}
.sd{width:7px;height:7px;border-radius:999px;background:var(--n2);box-shadow:0 0 6px var(--n2);animation:bl 2.2s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.sd.off{background:var(--n3);box-shadow:0 0 6px var(--n3);animation:none}
/* toasts */
.tw2{position:fixed;left:50%;bottom:68px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:7px;width:min(340px,calc(100vw - 24px));pointer-events:none}
.toast{padding:10px 14px;border-radius:11px;font-family:var(--fm);font-size:11.5px;border:1px solid var(--b);background:rgba(6,11,20,.92);color:var(--t);backdrop-filter:blur(14px);box-shadow:0 8px 26px rgba(0,0,0,.5);opacity:0;transform:translateY(5px);transition:.2s ease}
body.light .toast{background:rgba(255,255,255,.93)}
.toast.show{opacity:1;transform:none}
.toast.success{border-color:rgba(0,255,157,.38);color:var(--n2)}
.toast.warn{border-color:rgba(255,180,50,.38);color:#ffb432}
.toast.danger{border-color:rgba(255,45,110,.38);color:var(--n3)}
/* footer */
.ft{margin-top:18px;font-size:11px;color:var(--td);font-family:var(--fm)}
.ft a{color:var(--n);text-decoration:none;transition:color .2s}
.ft a:hover{color:var(--n2)}
.legal{margin-top:4px;opacity:.4;font-size:10px}
/* flash */
.fl{position:fixed;inset:0;background:var(--n3);opacity:0;pointer-events:none;z-index:999}
.fl.act{animation:fl .5s ease}
@keyframes fl{0%{opacity:0}25%{opacity:.12}100%{opacity:0}}
.time{margin-top:10px;font-family:var(--fm);font-size:11px;color:var(--td)}
#message{text-align:left;font-size:15px;line-height:1.72;color:var(--t);padding:14px;margin-top:11px;background:rgba(0,0,0,.2);border:1px solid var(--b);border-radius:var(--rs);word-break:break-word}
body.light #message{background:rgba(0,0,0,.04)}
/* animations */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .3s ease}
@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.reveal{animation:reveal .32s ease}
/* mobile */
@media(max-width:520px){
  body{padding:12px}
  .box{padding:20px 16px}
  .logo-text{font-size:17px;letter-spacing:3px}
  textarea{height:96px}
  .acts button{font-size:10.5px;padding:10px 3px}
  .tc{top:11px!important;right:11px!important}
  .tw2{bottom:62px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="fl" id="flash"></div>

<div class="tc">
  <button onclick="toggleTheme()">🌓</button>
  <button onclick="toggleLang()">🌐</button>
</div>

<div class="fs">
  <div class="sp">
    <span class="sd" id="onlineDot"></span>
    <span id="onlineText">online</span>
  </div>
</div>

<div class="tw2" id="toastWrap" aria-live="polite"></div>

<!-- CREATE -->
<div class="box" id="create">
  <div class="logo"><span class="logo-icon">🔐</span><span class="logo-text">Privinote</span></div>
  <h2 id="t_create">criar mensagem secreta</h2>
  <div class="tw">
    <textarea id="text" maxlength="5000"></textarea>
    <span class="cc" id="charCounter">0 / 5000</span>
  </div>
  <div class="opts">
    <div>
      <span class="lbl" id="t_expire_label">Expirar em</span>
      <select id="expire">
        <option value="600000">10 min</option>
        <option value="3600000">1 hora</option>
        <option value="86400000">1 dia</option>
        <option value="604800000">7 dias</option>
      </select>
    </div>
    <label class="tr" for="oneTime">
      <input type="checkbox" id="oneTime" checked>
      <span id="t_one_time">Abrir apenas 1 vez</span>
    </label>
    <div>
      <span class="lbl" id="t_pass_label">Senha (opcional)</span>
      <input id="pass" type="password">
    </div>
  </div>
  <button class="bp" onclick="createNote()" id="t_create_btn">Criar link secreto</button>
  <button class="bg" onclick="location.href='como-usar.html'" id="t_help_btn">📘 Ajuda</button>
  <div id="linkBox" style="display:none">
    <div class="divider"></div>
    <div class="lr"><div class="lk" id="result"></div></div>
    <div class="acts">
      <button class="bc"  onclick="copyLink()"    id="t_copy">📋 Copiar</button>
      <button class="bs"  onclick="shareLink()"   id="t_share">🔗 Enviar</button>
      <button class="bpv" onclick="previewLink()" id="t_preview">👁️ Ver</button>
    </div>
  </div>
  <div class="ft">
    <span id="t_created"></span><a href="https://t.me/Guizin16z" target="_blank">@Guizin16z</a>
    <div class="legal" id="t_legal"></div>
  </div>
</div>

<!-- BREAK -->
<div class="box" id="breaker" style="display:none">
  <div class="logo"><span class="logo-icon">⚠️</span><span class="logo-text">Privinote</span></div>
  <h2 id="t_protected"></h2>
  <p id="t_warning" style="font-size:13px;color:var(--td);margin:11px 0 0;line-height:1.65;font-family:var(--fm)"></p>
  <button class="bd" onclick="breakNote()" id="t_break"></button>
  <button class="bg" onclick="goCreate()"  id="t_new"></button>
</div>

<!-- VIEW -->
<div class="box" id="view" style="display:none">
  <div class="logo"><span class="logo-icon">📩</span><span class="logo-text">Privinote</span></div>
  <h2 id="t_message"></h2>
  <div id="message"></div>
  <div class="time" id="destroyTime"></div>
  <button class="bg" onclick="goCreate()" id="t_new2" style="margin-top:14px"></button>
  <button class="bg" onclick="goBack()" id="t_back" style="margin-top:6px;display:none">← Voltar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getFirestore,doc,setDoc,getDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const db=getFirestore(initializeApp({
  apiKey:"AIzaSyBHOFAcNcQ-397zebLS_n0G8M4meM7hVq8",
  authDomain:"privinote.firebaseapp.com",
  projectId:"privinote",
  storageBucket:"privinote.firebasestorage.app",
  messagingSenderId:"583662739248",
  appId:"1:583662739248:web:ba624aa2e0cd070a0272f5"
}));

const T={
  pt:{
    create:"criar mensagem secreta",ph:"Digite sua mensagem secreta... (HTML: <b>, <i>, <a>, <img>)",
    btn:"Criar link secreto",help:"📘 Ajuda",
    copy:"📋 Copiar",share:"🔗 Enviar",prev:"👁️ Ver",
    by:"criado por ",legal:"Não utilize para atividades ilegais.",
    prot:"mensagem protegida",warn:"Ao abrir, a mensagem será destruída permanentemente.",
    brk:"💣 Quebrar nota",nw:"➕ Nova nota",msg:"mensagem secreta",
    dest:"💥 destruída em: ",pph:"Defina uma senha (opcional)...",
    exp:"Expirar em",ot:"Abrir apenas 1 vez",pl:"Senha (opcional)",
    on:"online",off:"offline",
    nc:"✅ Nota criada!",nb:"💥 Nota destruída.",ne:"⏳ Nota expirada.",
    lc:"✅ Link copiado!",mt:"mensagem secreta",
    ei:"⏳ expira em {t}",po:"👁️ Pré-visualização (não destruída)",nf:"❌ Nota não encontrada ou expirada.",back:"← Voltar"
  },
  en:{
    create:"create secret message",ph:"Type your secret message... (HTML: <b>, <i>, <a>, <img>)",
    btn:"Create secret link",help:"📘 Help",
    copy:"📋 Copy",share:"🔗 Share",prev:"👁️ Preview",
    by:"created by ",legal:"Do not use for illegal activities.",
    prot:"protected message",warn:"Once opened, the message will be permanently destroyed.",
    brk:"💣 Break note",nw:"➕ New note",msg:"secret message",
    dest:"💥 destroyed at: ",pph:"Set a password (optional)...",
    exp:"Expires in",ot:"Open only once",pl:"Password (optional)",
    on:"online",off:"offline",
    nc:"✅ Note created!",nb:"💥 Note destroyed.",ne:"⏳ Note expired.",
    lc:"✅ Link copied!",mt:"secret message",
    ei:"⏳ expires in {t}",po:"👁️ Preview (not destroyed)",nf:"❌ Note not found or expired.",back:"← Back"
  }
};

let lang=localStorage.getItem("lang")||"pt";
const $=id=>document.getElementById(id);

function applyLang(){
  const t=T[lang];
  $("t_create").innerText=t.create;
  $("text").placeholder=t.ph;
  $("t_create_btn").innerText=t.btn;
  $("t_help_btn").innerText=t.help;
  $("t_copy").innerText=t.copy;
  $("t_share").innerText=t.share;
  $("t_preview").innerText=t.prev;
  $("t_created").innerText=t.by;
  $("t_legal").innerText=t.legal;
  $("t_protected").innerText=t.prot;
  $("t_warning").innerText=t.warn;
  $("t_break").innerText=t.brk;
  $("t_new").innerText=t.nw;
  $("t_new2").innerText=t.nw;
  $("t_message").innerText=t.msg;
  $("t_expire_label").innerText=t.exp;
  $("t_one_time").innerText=t.ot;
  $("t_pass_label").innerText=t.pl;
  $("pass").placeholder=t.pph;
  if($("t_back"))$("t_back").innerText=t.back||"← Voltar";
  updateStatus();
}
applyLang();

// char counter
const ta=$("text"),cc=$("charCounter");
ta.addEventListener("input",()=>{
  const l=ta.value.length;
  cc.textContent=`${l} / 5000`;
  cc.className="cc"+(l>4850?" d":l>4500?" w":"");
});

window.toggleLang=()=>{lang=lang==="pt"?"en":"pt";localStorage.setItem("lang",lang);applyLang()};
window.toggleTheme=()=>{document.body.classList.toggle("light");localStorage.setItem("theme",document.body.classList.contains("light")?"light":"dark")};
if(localStorage.getItem("theme")==="light")document.body.classList.add("light");

// toasts
const tw=$("toastWrap");
function toast(type,msg){
  const el=document.createElement("div");
  el.className="toast "+type;el.textContent=msg;
  tw.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  setTimeout(()=>el.classList.remove("show"),2400);
  setTimeout(()=>el.remove(),2640);
}

function updateStatus(){
  const on=navigator.onLine;
  $("onlineDot").classList.toggle("off",!on);
  $("onlineText").textContent=on?T[lang].on:T[lang].off;
}
window.addEventListener("online",updateStatus);
window.addEventListener("offline",updateStatus);

const noteId=new URLSearchParams(location.search).get("id");
const CE=$("create"),BR=$("breaker"),VW=$("view"),flash=$("flash");

function showBox(el){
  [CE,BR,VW].forEach(b=>{b.classList.remove("show");b.style.display="none"});
  el.style.display="block";
  requestAnimationFrame(()=>el.classList.add("show"));
}
document.querySelectorAll("button").forEach(b=>{
  b.addEventListener("click",()=>{b.classList.remove("rpl");void b.offsetWidth;b.classList.add("rpl")});
});
noteId?showBox(BR):showBox(CE);

const fd=ts=>{const d=new Date(ts);return d.toLocaleDateString()+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})};
const ft=s=>s<60?s+"s":s<3600?Math.floor(s/60)+"min":s<86400?Math.floor(s/3600)+"h":Math.floor(s/86400)+"d";
async function sha(str){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

window.breakNote=async()=>{
  flash.classList.add("act");
  setTimeout(async()=>{
    const me=$("message"),te=$("destroyTime");
    showBox(VW);me.classList.add("reveal");flash.classList.remove("act");
    const ref=doc(db,"notes",noteId),snap=await getDoc(ref),now=Date.now();
    if(!snap.exists()){me.innerText="❌ "+T[lang].nf;te.innerText="";return}
    const d=snap.data()||{};
    if(typeof d.expiresAt==="number"&&now>d.expiresAt){me.innerText="⏳";te.innerText="";toast("warn",T[lang].ne);await deleteDoc(ref);return}
    if(d.passHash){
      const e=prompt(lang==="pt"?"Digite a senha:":"Enter password:")||"";
      if(await sha(e)!==d.passHash){me.innerText=lang==="pt"?"🔒 Senha incorreta.":"🔒 Wrong password.";te.innerText="";return}
    }
    me.innerHTML=DOMPurify.sanitize(d.text||"",{
      USE_PROFILES:{html:true},
      ALLOWED_TAGS:["b","strong","i","em","u","s","p","br","hr","blockquote","h1","h2","h3","h4","ul","ol","li","a","span","div","img"],
      ALLOWED_ATTR:["href","title","target","rel","src","alt","width","height","style","loading","referrerpolicy"]
    });
    te.innerText=T[lang].dest+fd(now);
    if(d.oneTime!==false)await deleteDoc(ref);
    toast("danger",T[lang].nb);
  },500);
};

window.createNote=async()=>{
  const text=ta.value.trim();
  if(!text){CE.classList.remove("shake");void CE.offsetWidth;CE.classList.add("shake");return}
  const ms=parseInt($("expire").value,10),ot=$("oneTime").checked,pw=$("pass").value||"";
  const id=Math.random().toString(36).substring(2,10);
  const p={text,createdAt:Date.now(),oneTime:ot,expiresAt:Date.now()+(isNaN(ms)?86400000:ms)};
  if(pw.trim())p.passHash=await sha(pw.trim());
  await setDoc(doc(db,"notes",id),p);
  const url=`${location.origin}${location.pathname}?id=${id}`;
  $("result").innerText=url;
  $("linkBox").style.display="block";
  toast("success",T[lang].nc);
};

window.copyLink=()=>{navigator.clipboard.writeText($("result").innerText);toast("success",T[lang].lc)};

window.shareLink=async()=>{
  const url=$("result").innerText;
  if(navigator.share){try{await navigator.share({title:"Privinote",text:"Link secreto:",url});return}catch(e){}}
  await navigator.clipboard.writeText(url);toast("success",T[lang].lc);
};

window.previewLink=async()=>{
  const url=$("result").innerText;if(!url)return;
  try{
    const pid=new URL(url).searchParams.get("id");
    if(!pid){window.open(url,"_blank","noopener,noreferrer");return}
    const snap=await getDoc(doc(db,"notes",pid));
    if(!snap.exists()){toast("danger",T[lang].nf);return}
    const d=snap.data();
    if(d.expiresAt&&d.expiresAt<Date.now()){toast("warn",T[lang].ne);return}
    showBox(VW);
    $("t_message").innerText=T[lang].mt;
    $("message").innerHTML=DOMPurify.sanitize(d.text||"");
    $("destroyTime").innerText=d.expiresAt?T[lang].ei.replace("{t}",ft(Math.max(0,Math.floor((d.expiresAt-Date.now())/1000)))):"";
    // mostra botão voltar só no preview (não na quebra real)
    $("t_back").style.display="block";
    $("t_new2").style.display="none";
    toast("success",T[lang].po);
  }catch(e){window.open(url,"_blank","noopener,noreferrer")}
};

window.goCreate=()=>location.href=location.pathname;
window.goBack=()=>{
  // volta para a tela de criação e reabre o linkBox
  showBox(CE);
  $("linkBox").style.display="block";
  $("t_back").style.display="none";
  $("t_new2").style.display="block";
};

// ===== PARTICLE NETWORK =====
const cv=document.getElementById("rain"),cx=cv.getContext("2d");
const mob=matchMedia("(max-width:520px)").matches;
let run=true;
document.addEventListener("visibilitychange",()=>{run=!document.hidden});

function rsz(){
  cv.width=innerWidth;cv.height=innerHeight;
}
rsz();addEventListener("resize",()=>{rsz();initParticles()});

const N=mob?45:80,MAX_DIST=mob?120:150;
let pts=[];

function initParticles(){
  pts=[];
  for(let i=0;i<N;i++) pts.push({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    vx:(Math.random()-.5)*.4,
    vy:(Math.random()-.5)*.4,
    r:Math.random()*1.8+.6,
    // alterna entre neon azul e verde
    c:Math.random()>.75?1:0
  });
}
initParticles();

// paleta: 0=neon azul, 1=neon verde
const COL=["#00d2ff","#00ff9d"];
const COL_DIM=["rgba(0,210,255,","rgba(0,255,157,"];

let frame=0;
function loop(){
  requestAnimationFrame(loop);
  if(!run)return;
  if(mob&&(frame++&1))return; // mobile: rende 30fps

  cx.clearRect(0,0,innerWidth,innerHeight);

  // linhas entre partículas próximas
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<MAX_DIST){
        const alpha=(1-dist/MAX_DIST)*.18;
        cx.beginPath();
        cx.globalAlpha=alpha;
        cx.strokeStyle=COL[pts[i].c];
        cx.lineWidth=.6;
        cx.moveTo(pts[i].x,pts[i].y);
        cx.lineTo(pts[j].x,pts[j].y);
        cx.stroke();
      }
    }
  }

  // pontos
  for(const p of pts){
    cx.beginPath();
    cx.globalAlpha=.55;
    cx.fillStyle=COL[p.c];
    cx.shadowBlur=p.c?6:4;
    cx.shadowColor=COL[p.c];
    cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fill();
    // mover
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>innerWidth) p.vx*=-1;
    if(p.y<0||p.y>innerHeight) p.vy*=-1;
  }
  cx.shadowBlur=0;
}
loop();
</script>
