<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PriviNot</title>

<style>
:root {
  --bg: #0f2027;
  --card: #111827;
  --text: #ffffff;
  --sub: #9ca3af;
  --primary: #3b82f6;
  --premium: #f43f5e;
  --input: #1f2933;
}

body.light {
  --bg: #f3f4f6;
  --card: #ffffff;
  --text: #111827;
  --sub: #6b7280;
  --input: #e5e7eb;
}

* {
  box-sizing: border-box;
  font-family: system-ui, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #0f2027, #203a43);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: var(--text);
}

.card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,.4);
  animation: fade .4s ease;
}

@keyframes fade {
  from { opacity:0; transform: translateY(10px); }
  to { opacity:1; transform: translateY(0); }
}

h1 {
  text-align: center;
  margin: 0;
  font-size: 22px;
}

p {
  text-align: center;
  font-size: 14px;
  color: var(--sub);
  margin-bottom: 20px;
}

input, textarea {
  width: 100%;
  background: var(--input);
  border: none;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  color: var(--text);
  font-size: 15px;
}

textarea {
  resize: none;
  height: 100px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  transform: scale(1.02);
}

.btn-main {
  background: var(--primary);
  color: white;
}

.btn-premium {
  background: var(--premium);
  color: white;
  margin-top: 10px;
}

.options {
  margin-top: 10px;
}

.toggle {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--sub);
  cursor: pointer;
  margin: 10px 0;
}

.footer {
  margin-top: 16px;
  font-size: 13px;
  text-align: center;
  color: var(--sub);
}

.footer a {
  color: var(--primary);
  text-decoration: none;
}
</style>
</head>

<body>

<div class="card">
  <h1>🔐 Criar nota secreta</h1>
  <p>A nota será destruída após ser lida</p>

  <textarea placeholder="Digite sua mensagem secreta..."></textarea>

  <div class="toggle" onclick="toggleOptions()">⚙ Opções avançadas</div>

  <div class="options" id="opts" style="display:none">
    <input placeholder="URL da imagem (premium)">
    <input placeholder="Link do botão (Telegram)">
  </div>

  <button class="btn-main">Criar nota</button>

  <button class="btn-premium">⭐ Criar nota premium</button>

  <div class="footer">
    Criado por <a href="https://t.me/Guizin16z" target="_blank">@Guizin16z</a>
  </div>
</div>

<script>
function toggleOptions() {
  const o = document.getElementById("opts");
  o.style.display = o.style.display === "none" ? "block" : "none";
}
</script>

</body>
</html>
