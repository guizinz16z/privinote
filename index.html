<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== TOKENS ===== */
:root {
  --bg:        #060b14;
  --surface:   rgba(8, 18, 36, 0.88);
  --border:    rgba(0, 210, 255, 0.18);
  --border-h:  rgba(0, 210, 255, 0.55);
  --neon:      #00d2ff;
  --neon2:     #00ff9d;
  --neon3:     #ff2d6e;
  --neon-glow: rgba(0, 210, 255, 0.3);
  --text:      #e2f0ff;
  --text-dim:  rgba(226, 240, 255, 0.48);
  --font-display: 'Orbitron', sans-serif;
  --font-mono:    'Share Tech Mono', monospace;
  --font-body:    'Inter', sans-serif;
  --r: 14px;
  --r-sm: 10px;
}
body.light {
  --bg:        #f0f4fa;
  --surface:   rgba(255,255,255,0.93);
  --border:    rgba(0, 100, 190, 0.18);
  --border-h:  rgba(0, 100, 190, 0.5);
  --neon:      #006fc2;
  --neon2:     #009a60;
  --neon3:     #d4003a;
  --neon-glow: rgba(0, 111, 194, 0.18);
  --text:      #0a1628;
  --text-dim:  rgba(10, 22, 40, 0.48);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  transition: background .35s, color .35s;
  overflow-x: hidden;
}

/* grid bg */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(0,210,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,210,255,.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none; z-index:0;
}
body.light::before {
  background-image:
    linear-gradient(rgba(0,100,190,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,100,190,.05) 1px, transparent 1px);
}

#rain {
  position:fixed; inset:0;
  pointer-events:none; z-index:0; opacity:.28;
}

/* ===== CARD ===== */
.box {
  position:relative; z-index:2;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 28px 26px;
  max-width: 452px;
  width: 100%;
  text-align: center;
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 0 0 1px var(--border), 0 0 50px rgba(0,210,255,.06), 0 28px 65px rgba(0,0,0,.6);
  opacity:0;
  transform: translateY(16px);
  transition: opacity .4s ease, transform .4s ease, border-color .3s, box-shadow .3s;
}
.box.show { opacity:1; transform:translateY(0); }
.box:hover {
  border-color: var(--border-h);
  box-shadow: 0 0 0 1px var(--border-h), 0 0 70px rgba(0,210,255,.1), 0 28px 65px rgba(0,0,0,.6);
}

/* ===== LOGO ===== */
.logo {
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom: 20px;
}
.logo-icon {
  font-size:24px;
  animation: icon-pulse 3s ease-in-out infinite;
}
@keyframes icon-pulse {
  0%,100%{ filter: drop-shadow(0 0 5px var(--neon)); }
  50%    { filter: drop-shadow(0 0 14px var(--neon)); }
}
.logo-text {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 4px;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--neon), var(--neon2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.box h2 {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 16px;
}

.divider {
  height:1px;
  background: linear-gradient(90deg, transparent, var(--border-h), transparent);
  margin: 16px 0;
}

/* ===== TEXTAREA ===== */
.textarea-wrap { position:relative; width:100%; }
textarea {
  width:100%;
  height:120px;
  background: rgba(0,0,0,.32);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 13px 13px 30px;
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--text);
  outline:none; resize:none;
  transition: border-color .22s, box-shadow .22s;
}
body.light textarea { background: rgba(255,255,255,.6); }
textarea::placeholder { color: var(--text-dim); }
textarea:focus {
  border-color: var(--neon);
  box-shadow: 0 0 0 3px var(--neon-glow);
}
.char-counter {
  position:absolute; bottom:9px; right:11px;
  font-family: var(--font-mono); font-size:11px;
  color: var(--text-dim); pointer-events:none;
  transition: color .2s;
}
.char-counter.warn   { color:#ffb347; }
.char-counter.danger { color: var(--neon3); }

/* ===== OPTIONS ===== */
.options {
  text-align:left; margin-top:13px;
  display:flex; flex-direction:column; gap:10px;
}
.opt-label {
  display:block;
  font-family: var(--font-mono);
  font-size:10px; letter-spacing:1.5px;
  text-transform:uppercase; color: var(--neon);
  margin-bottom:5px;
}
.options select,
.options input[type="password"] {
  width:100%; padding:10px 13px;
  background: rgba(0,0,0,.28);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text);
  font-family: var(--font-body); font-size:14px;
  outline:none; appearance:none; -webkit-appearance:none;
  transition: border-color .2s, box-shadow .2s;
}
body.light .options select,
body.light .options input[type="password"] { background: rgba(255,255,255,.65); }
.options select:focus,
.options input[type="password"]:focus {
  border-color: var(--neon);
  box-shadow: 0 0 0 3px var(--neon-glow);
}
.options select option { background:#0a1628; color: var(--text); }

.toggle-row {
  display:flex; align-items:center; gap:11px;
  padding: 10px 13px;
  background: rgba(0,210,255,.04);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor:pointer;
  transition: border-color .2s, background .2s;
  user-select:none;
}
.toggle-row:hover {
  border-color: var(--border-h);
  background: rgba(0,210,255,.09);
}
.toggle-row span {
  font-size:13px; color: var(--text); flex:1;
}
/* custom checkbox */
.toggle-row input[type="checkbox"] {
  appearance:none; -webkit-appearance:none;
  width:17px; height:17px; flex-shrink:0;
  border: 1.5px solid var(--border-h);
  border-radius:5px; background:transparent;
  cursor:pointer; position:relative;
  transition: background .18s, border-color .18s;
}
.toggle-row input[type="checkbox"]:checked {
  background: var(--neon); border-color: var(--neon);
}
.toggle-row input[type="checkbox"]:checked::after {
  content:'';
  position:absolute; left:4px; top:1px;
  width:5px; height:10px;
  border:2px solid #000; border-top:none; border-left:none;
  transform: rotate(45deg);
}

/* ===== BUTTONS ===== */
button {
  width:100%; padding:13px 16px;
  border:none; border-radius: var(--r-sm);
  font-family: var(--font-body); font-size:14px;
  font-weight:600; cursor:pointer;
  position:relative; overflow:hidden;
  transition: transform .18s, box-shadow .18s, filter .18s;
  letter-spacing:.4px;
}
button:active { transform:scale(.97) !important; }

button::after {
  content:''; position:absolute;
  width:10px; height:10px; left:50%; top:50%;
  transform:translate(-50%,-50%) scale(1);
  background:rgba(255,255,255,.28); border-radius:999px;
  opacity:0; pointer-events:none;
}
button.ripple::after { animation: ripple .48s ease-out; }
@keyframes ripple {
  0%  { opacity:.5; transform:translate(-50%,-50%) scale(1); }
  100%{ opacity:0;  transform:translate(-50%,-50%) scale(28); }
}

.btn-primary {
  background: linear-gradient(135deg, var(--neon), #0072ff);
  color:#000; font-weight:700; margin-top:14px;
  font-family: var(--font-display); font-size:11px;
  letter-spacing:2.5px; text-transform:uppercase;
  box-shadow: 0 0 22px rgba(0,210,255,.28);
}
.btn-primary:hover {
  box-shadow: 0 0 38px rgba(0,210,255,.5);
  transform: translateY(-1px);
}

.btn-danger {
  background: linear-gradient(135deg, var(--neon3), #ff7a00);
  color:#fff; font-weight:700; margin-top:14px;
  font-family: var(--font-display); font-size:11px;
  letter-spacing:2.5px; text-transform:uppercase;
  box-shadow: 0 0 22px rgba(255,45,110,.28);
}
.btn-danger:hover {
  box-shadow: 0 0 38px rgba(255,45,110,.5);
  transform: translateY(-1px);
}

.btn-ghost {
  background:transparent;
  border: 1px solid var(--border);
  color: var(--text-dim); margin-top:8px; font-size:13px;
}
.btn-ghost:hover {
  border-color: var(--border-h);
  color: var(--text);
  background: rgba(0,210,255,.05);
}

/* action grid */
.actions {
  display:grid; grid-template-columns:1fr 1fr 1fr;
  gap:8px; margin-top:12px;
}
.actions button { margin:0; padding:11px 6px; font-size:12px; border-radius: var(--r-sm); }

.btn-copy {
  background: rgba(0,255,157,.1);
  border: 1px solid rgba(0,255,157,.28); color: var(--neon2);
}
.btn-copy:hover { background:rgba(0,255,157,.2); border-color: var(--neon2); }

.btn-share {
  background: rgba(0,210,255,.1);
  border: 1px solid rgba(0,210,255,.28); color: var(--neon);
}
.btn-share:hover { background:rgba(0,210,255,.2); border-color: var(--neon); }

.btn-preview {
  background: rgba(255,180,50,.08);
  border: 1px solid rgba(255,180,50,.28); color:#ffb432;
}
.btn-preview:hover { background:rgba(255,180,50,.18); border-color:#ffb432; }

/* ===== LINK BOX ===== */
.link-result {
  margin-top:13px; padding:11px 13px;
  background: rgba(0,255,157,.05);
  border: 1px solid rgba(0,255,157,.2);
  border-radius: var(--r-sm);
}
.link {
  font-family: var(--font-mono); font-size:11.5px;
  color: var(--neon2); word-break:break-all; line-height:1.65;
}

/* ===== TOP CONTROLS ===== */
.top-controls {
  position:fixed !important; top:14px !important; right:14px !important;
  left:auto !important; bottom:auto !important;
  z-index:9999 !important; display:flex; gap:6px;
}
.top-controls button {
  width:auto; padding:7px 11px; font-size:14px;
  border-radius:8px; margin:0;
  background: rgba(0,0,0,.5);
  border: 1px solid var(--border);
  color: var(--text);
  backdrop-filter:blur(10px);
}
body.light .top-controls button { background:rgba(255,255,255,.75); }
.top-controls button:hover {
  border-color: var(--border-h);
  background: rgba(0,210,255,.1);
}

/* ===== STATUS PILL ===== */
.float-status { position:fixed; left:14px; bottom:14px; z-index:9999; }
.status-pill {
  display:flex; align-items:center; gap:7px;
  padding:7px 12px; border-radius:999px;
  font-family: var(--font-mono); font-size:11px; color: var(--text-dim);
  border: 1px solid var(--border);
  background: rgba(0,0,0,.42); backdrop-filter:blur(12px);
}
body.light .status-pill { background:rgba(255,255,255,.78); }
.status-dot {
  width:7px; height:7px; border-radius:999px;
  background: var(--neon2);
  box-shadow: 0 0 7px var(--neon2);
  animation: dot-blink 2.2s ease-in-out infinite;
}
@keyframes dot-blink { 0%,100%{opacity:1} 50%{opacity:.35} }
.status-dot.off { background:var(--neon3); box-shadow:0 0 7px var(--neon3); animation:none; }

/* ===== TOASTS ===== */
.toast-wrap {
  position:fixed; left:50%; bottom:70px;
  transform:translateX(-50%);
  z-index:9999; display:flex; flex-direction:column; gap:8px;
  width:min(340px, calc(100vw - 24px)); pointer-events:none;
}
.toast {
  padding:11px 15px; border-radius:11px;
  font-family: var(--font-mono); font-size:12px;
  border: 1px solid var(--border);
  background: rgba(6,11,20,.92); color: var(--text);
  backdrop-filter:blur(16px);
  box-shadow: 0 8px 28px rgba(0,0,0,.5);
  opacity:0; transform:translateY(6px); transition:.2s ease;
}
body.light .toast { background:rgba(255,255,255,.93); }
.toast.show { opacity:1; transform:translateY(0); }
.toast.success { border-color:rgba(0,255,157,.4); color: var(--neon2); }
.toast.warn    { border-color:rgba(255,180,50,.4);  color:#ffb432; }
.toast.danger  { border-color:rgba(255,45,110,.4);  color: var(--neon3); }

/* ===== FOOTER ===== */
.footer {
  margin-top:20px; font-size:11px;
  color: var(--text-dim); font-family: var(--font-mono);
}
.footer a { color: var(--neon); text-decoration:none; transition:color .2s; }
.footer a:hover { color: var(--neon2); }
.legal { margin-top:5px; opacity:.45; font-size:10px; }

/* ===== FLASH ===== */
.flash { position:fixed; inset:0; background: var(--neon3); opacity:0; pointer-events:none; z-index:999; }
.flash.active { animation: flash .5s ease; }
@keyframes flash { 0%{opacity:0} 25%{opacity:.12} 100%{opacity:0} }

/* ===== TIME + MESSAGE ===== */
.time { margin-top:11px; font-family: var(--font-mono); font-size:11.5px; color: var(--text-dim); }

#message {
  text-align:left; font-size:15px; line-height:1.72; color: var(--text);
  padding:15px; margin-top:12px;
  background: rgba(0,0,0,.22);
  border: 1px solid var(--border);
  border-radius: var(--r-sm); word-break:break-word;
}
body.light #message { background:rgba(0,0,0,.04); }

/* ===== ANIMATIONS ===== */
@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%    {transform:translateX(-7px)}
  40%    {transform:translateX(7px)}
  60%    {transform:translateX(-5px)}
  80%    {transform:translateX(5px)}
}
.shake { animation:shake .32s ease; }
@keyframes reveal { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.reveal { animation:reveal .35s ease; }

/* ===== MOBILE ===== */
@media(max-width:520px){
  body { padding:12px; }
  .box { padding:22px 18px; }
  .logo-text { font-size:17px; letter-spacing:3px; }
  textarea { height:100px; }
  .actions button { font-size:11px; padding:10px 4px; }
  .top-controls { top:12px !important; right:12px !important; }
  .toast-wrap { bottom:65px; }
}
@media(prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

// toasts
const toastWrap=document.getElementById("toastWrap");
function showToast(type,msg){
  const el=document.createElement("div");
  el.className="toast "+(type||"success");
  el.textContent=msg;
  toastWrap.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  setTimeout(()=>el.classList.remove("show"),2400);
  setTimeout(()=>el.remove(),2660);
}

function updateOnlineStatus(){
  const dot=document.getElementById("onlineDot");
  const txt=document.getElementById("onlineText");
  const on=navigator.onLine;
  dot.classList.toggle("off",!on);
  txt.textContent=on?(texts[lang].online||"online"):(texts[lang].offline||"offline");
}
window.addEventListener("online",updateOnlineStatus);
window.addEventListener("offline",updateOnlineStatus);
updateOnlineStatus();

const params=new URLSearchParams(location.search);
const noteId=params.get("id");
const createEl=document.getElementById("create");
const breakerEl=document.getElementById("breaker");
const viewEl=document.getElementById("view");
const msgEl=document.getElementById("message");
const timeEl=document.getElementById("destroyTime");
const flash=document.getElementById("flash");

function showBox(el){
  [createEl,breakerEl,viewEl].forEach(b=>{ b.classList.remove("show"); b.style.display="none"; });
  el.style.display="block";
  requestAnimationFrame(()=>el.classList.add("show"));
}

document.querySelectorAll("button").forEach(btn=>{
  btn.addEventListener("click",()=>{ btn.classList.remove("ripple"); void btn.offsetWidth; btn.classList.add("ripple"); });
});

if(noteId){ showBox(breakerEl); } else { showBox(createEl); }

function formatDate(ts){ const d=new Date(ts); return d.toLocaleDateString()+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
function formatTime(s){ if(s<60)return s+"s"; if(s<3600)return Math.floor(s/60)+"min"; if(s<86400)return Math.floor(s/3600)+"h"; return Math.floor(s/86400)+"d"; }
async function sha256Hex(str){
  const enc=new TextEncoder().encode(str);
  const buf=await crypto.subtle.digest("SHA-256",enc);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

window.breakNote=async()=>{
  flash.classList.add("active");
  setTimeout(async()=>{
    showBox(viewEl);
    msgEl.classList.add("reveal");
    flash.classList.remove("active");
    const ref=doc(db,"notes",noteId);
    const snap=await getDoc(ref);
    const now=Date.now();
    if(!snap.exists()){
      msgEl.innerText="❌ "+texts[lang].noteNotFound;
      timeEl.innerText=""; return;
    }
    const data=snap.data()||{};
    if(typeof data.expiresAt==="number"&&now>data.expiresAt){
      msgEl.innerText="⏳"; timeEl.innerText="";
      showToast("warn",texts[lang].noteExpired);
      await deleteDoc(ref); return;
    }
    if(data.passHash){
      const entered=prompt(lang==="pt"?"Digite a senha:":"Enter password:")||"";
      const h=await sha256Hex(entered);
      if(h!==data.passHash){ msgEl.innerText=lang==="pt"?"🔒 Senha incorreta.":"🔒 Wrong password."; timeEl.innerText=""; return; }
    }
    msgEl.innerHTML=DOMPurify.sanitize(data.text||"",{
      USE_PROFILES:{html:true},
      ALLOWED_TAGS:["b","strong","i","em","u","s","p","br","hr","blockquote","h1","h2","h3","h4","ul","ol","li","a","span","div","img"],
      ALLOWED_ATTR:["href","title","target","rel","src","alt","width","height","style","loading","referrerpolicy"]
    });
    timeEl.innerText=texts[lang].destroyed+formatDate(now);
    if(data.oneTime!==false) await deleteDoc(ref);
    showToast("danger",texts[lang].noteBroken);
  },500);
};

window.createNote=async()=>{
  const text=document.getElementById("text").value.trim();
  if(!text){ createEl.classList.remove("shake"); void createEl.offsetWidth; createEl.classList.add("shake"); return; }
  const expireMs=parseInt(document.getElementById("expire").value,10);
  const oneTime=document.getElementById("oneTime").checked;
  const pass=document.getElementById("pass").value||"";
  const newId=Math.random().toString(36).substring(2,10);
  const payload={text,createdAt:Date.now(),oneTime,expiresAt:Date.now()+(isNaN(expireMs)?86400000:expireMs)};
  if(pass.trim()) payload.passHash=await sha256Hex(pass.trim());
  await setDoc(doc(db,"notes",newId),payload);
  const url=`${location.origin}${location.pathname}?id=${newId}`;
  document.getElementById("result").innerText=url;
  document.getElementById("linkBox").style.display="block";
  showToast("success",texts[lang].noteCreated);
};

window.copyLink=()=>{ navigator.clipboard.writeText(document.getElementById("result").innerText); showToast("success",texts[lang].linkCopied); };

window.shareLink=async()=>{
  const url=document.getElementById("result").innerText;
  if(navigator.share){ try{ await navigator.share({title:"Privinote",text:"Link secreto:",url}); return; }catch(e){} }
  await navigator.clipboard.writeText(url);
  showToast("success",texts[lang].linkCopied);
};

window.previewLink=async()=>{
  const url=document.getElementById("result").innerText;
  if(!url) return;
  try{
    const u=new URL(url);
    const pid=u.searchParams.get("id");
    if(!pid){ window.open(url,"_blank","noopener,noreferrer"); return; }
    const snap=await getDoc(doc(db,"notes",pid));
    if(!snap.exists()){ showToast("danger",texts[lang].noteNotFound); return; }
    const data=snap.data();
    if(data.expiresAt&&data.expiresAt<Date.now()){ showToast("warn",texts[lang].noteExpired); return; }
    showBox(viewEl);
    document.getElementById("t_message").innerText=texts[lang].messageTitle;
    document.getElementById("message").innerHTML=DOMPurify.sanitize(data.text||"");
    if(data.expiresAt){
      const left=Math.max(0,Math.floor((data.expiresAt-Date.now())/1000));
      document.getElementById("destroyTime").innerText=texts[lang].expiresIn.replace("{time}",formatTime(left));
    } else document.getElementById("destroyTime").innerText="";
    showToast("success",texts[lang].previewOpened);
  }catch(e){ window.open(url,"_blank","noopener,noreferrer"); }
};

window.goCreate=()=>location.href=location.pathname;

// ===== RAIN =====
const rainCanvas=document.getElementById("rain");
const rctx=rainCanvas.getContext("2d");
let running=true;
document.addEventListener("visibilitychange",()=>{ running=!document.hidden; });
function resizeRain(){
  const dpr=Math.min(window.devicePixelRatio||1,1.5);
  rainCanvas.width=Math.floor(innerWidth*dpr);
  rainCanvas.height=Math.floor(innerHeight*dpr);
  rainCanvas.style.width=innerWidth+"px";
  rainCanvas.style.height=innerHeight+"px";
  rctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeRain();
addEventListener("resize",resizeRain);
const isMob=matchMedia("(max-width:520px)").matches;
const drops=Array.from({length:isMob?55:95},()=>({
  x:Math.random()*innerWidth, y:Math.random()*innerHeight,
  l:Math.random()*15+5, s:Math.random()*4.5+2,
  w:Math.random()*.9+.25, a:Math.random()*.22+.06,
  glow:Math.random()>.88
}));
let lightning=0,nextL=Date.now()+(3000+Math.random()*5000);
function rain(){
  requestAnimationFrame(rain);
  if(!running) return;
  rctx.clearRect(0,0,innerWidth,innerHeight);
  const now=Date.now();
  if(now>nextL){ lightning=.35+Math.random()*.25; nextL=now+(3000+Math.random()*5000); }
  lightning*=.88; if(lightning<.01) lightning=0;
  if(lightning>0){
    rctx.save(); rctx.globalAlpha=lightning*.12;
    rctx.fillStyle="#00d2ff"; rctx.fillRect(0,0,innerWidth,innerHeight);
    rctx.restore();
  }
  for(const d of drops){
    rctx.beginPath(); rctx.globalAlpha=d.a;
    rctx.strokeStyle=d.glow?"#00ff9d":"#00d2ff";
    rctx.lineWidth=d.w; rctx.shadowBlur=d.glow?5:0; rctx.shadowColor="#00d2ff";
    rctx.moveTo(d.x,d.y); rctx.lineTo(d.x+d.w*.4,d.y+d.l); rctx.stroke();
    d.y+=d.s; d.x+=.25;
    if(d.y>innerHeight+30){ d.y=-15; d.x=Math.random()*innerWidth; }
    if(d.x>innerWidth+30){ d.x=-15; }
  }
}
rain();
</script>
