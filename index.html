<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Privinote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg-dark: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  --bg-light: linear-gradient(135deg,#f5f7fa,#c3cfe2);
  --box-dark: rgba(0,0,0,.65);
  --box-light: rgba(255,255,255,.92);
  --text-dark:#fff;
  --text-light:#111;
  --accent:#00c6ff;
}

body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg-dark);
  color:var(--text-dark);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.4s;
}

body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

.box{
  background:var(--box-dark);
  padding:26px;
  border-radius:20px;
  max-width:440px;
  width:100%;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.45);
  animation:slide .5s ease;
}

body.light .box{background:var(--box-light);}

@keyframes slide{
  from{transform:translateY(30px);opacity:0}
  to{transform:none;opacity:1}
}

textarea{
  width:100%;
  height:120px;
  border-radius:14px;
  border:none;
  padding:14px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
  transition:.25s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.secondary{
  background:#444;
}

.copy-btn{
  background:#00ffcc;
  color:#000;
  font-weight:bold;
}

.link{
  word-break:break-all;
  font-size:14px;
  color:#00ffcc;
  margin-top:12px;
}

.footer{
  margin-top:18px;
  font-size:12px;
  opacity:.75;
}

.footer a{color:var(--accent);text-decoration:none;font-weight:bold}

.legal{font-size:11px;opacity:.55;margin-top:6px}

.top-controls{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  gap:8px;
}

.top-controls button{
  width:auto;
  padding:8px 12px;
  font-size:14px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- CONTROLES -->
<div class="top-controls">
  <button onclick="toggleTheme()">🌓</button>
  <button onclick="toggleLang()">🌐</button>
</div>

<!-- CRIAR NOTA -->
<div class="box">
  <h2 id="t_title">🔐 Criar mensagem secreta</h2>

  <textarea id="text" placeholder=""></textarea>

  <button onclick="createNote()" id="t_create"></button>

  <div id="linkBox" style="display:none">
    <div class="link" id="result"></div>
    <button class="copy-btn" onclick="copyLink()" id="t_copy"></button>
  </div>

  <!-- BOTÕES DE NAVEGAÇÃO -->
  <div style="margin-top:16px">
    <button onclick="location.href='premium.html'">⭐ Criar nota premium</button>
    <button class="secondary" onclick="location.href='about.html'">
      ℹ️ Como funciona
    </button>
  </div>

  <div class="footer">
    <span id="t_created"></span>
    <a href="https://t.me/Guizin16z" target="_blank">@Guizin16z</a>
    <div class="legal" id="t_legal"></div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,doc,setDoc} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBHOFAcNcQ-397zebLS_n0G8M4meM7hVq8",
  authDomain:"privinote.firebaseapp.com",
  projectId:"privinote",
  storageBucket:"privinote.firebasestorage.app",
  messagingSenderId:"583662739248",
  appId:"1:583662739248:web:ba624aa2e0cd070a0272f5"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* TEXTOS */
const texts={
pt:{
title:"🔐 Criar mensagem secreta",
placeholder:"Digite sua mensagem secreta...",
create:"Criar link secreto",
copy:"📋 Copiar link",
created:"Criado por ",
legal:"Não utilize para atividades ilegais."
},
en:{
title:"🔐 Create secret message",
placeholder:"Type your secret message...",
create:"Create secret link",
copy:"📋 Copy link",
created:"Created by ",
legal:"Do not use for illegal activities."
}
};

let lang=localStorage.getItem("lang")||"pt";

function applyLang(){
const t=texts[lang];
document.getElementById("t_title").innerText=t.title;
document.getElementById("text").placeholder=t.placeholder;
document.getElementById("t_create").innerText=t.create;
document.getElementById("t_copy").innerText=t.copy;
document.getElementById("t_created").innerText=t.created;
document.getElementById("t_legal").innerText=t.legal;
}
applyLang();

window.toggleLang=()=>{
lang=lang==="pt"?"en":"pt";
localStorage.setItem("lang",lang);
applyLang();
};

window.toggleTheme=()=>{
document.body.classList.toggle("light");
localStorage.setItem("theme",
document.body.classList.contains("light")?"light":"dark");
};
if(localStorage.getItem("theme")==="light")
document.body.classList.add("light");

/* FUNÇÕES */
window.createNote=async()=>{
const text=document.getElementById("text").value.trim();
if(!text) return alert("Digite algo");

const id=Math.random().toString(36).substring(2,10);
await setDoc(doc(db,"notes",id),{
text,
createdAt:Date.now()
});

document.getElementById("result").innerText=
`${location.origin}${location.pathname}?id=${id}`;

document.getElementById("linkBox").style.display="block";
};

window.copyLink=()=>{
navigator.clipboard.writeText(result.innerText);
};
</script>

</body>
</html>
