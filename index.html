<style>
:root{
  --bg-dark: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  --bg-light: linear-gradient(135deg,#f5f7fa,#c3cfe2);
  --box-dark: rgba(0,0,0,.65);
  --box-light: rgba(255,255,255,.92);
  --text-dark:#fff;
  --text-light:#111;
  --accent:#00c6ff;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:16px;
  font-family:"Inter","Segoe UI",Arial,sans-serif;
  background:var(--bg-dark);
  color:var(--text-dark);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.4s;
}

body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

.box{
  background:var(--box-dark);
  padding:26px;
  border-radius:20px;
  max-width:440px;
  width:100%;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.45);
  animation:slide .5s ease;
}

body.light .box{background:var(--box-light);}

@keyframes slide{
  from{transform:translateY(30px);opacity:0}
  to{transform:none;opacity:1}
}

textarea{
  width:100%;
  height:120px;
  border-radius:14px;
  border:none;
  padding:14px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
  transition:.25s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.danger{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  font-weight:bold;
}

.copy-btn{
  background:#00ffcc;
  color:#000;
  font-weight:bold;
}

.link{
  word-break:break-all;
  font-size:14px;
  color:#00ffcc;
  margin-top:12px;
}

.footer{
  margin-top:18px;
  font-size:12px;
  opacity:.75;
}

.footer a{color:var(--accent);text-decoration:none;font-weight:bold}

.legal{font-size:11px;opacity:.55;margin-top:6px}

.privacy{
  margin-top:12px;
  padding:12px 14px;
  border-radius:14px;
  text-align:left;
  background: rgba(0,0,0,.22);
  border: 1px solid rgba(255,255,255,.10);
}
body.light .privacy{
  background: rgba(255,255,255,.65);
  border: 1px solid rgba(0,0,0,.10);
}
.privacy-title{
  font-weight:700;
  margin-bottom:8px;
}
.privacy ul{
  margin:0;
  padding-left:18px;
}
.privacy li{
  margin:6px 0;
  font-size:12.5px;
  opacity:.9;
}

.top-controls{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  gap:8px;
}

.top-controls button{
  width:auto;
  padding:8px 12px;
  font-size:14px;
  border-radius:10px;
}

.flash{
  position:fixed;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

.flash.active{animation:flash .5s}

@keyframes flash{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

.time{
  margin-top:12px;
  font-size:13px;
  opacity:.75;
}

/* ======= ADICIONADO (opções 2 e 3) ======= */
.options{
  margin-top:10px;
  text-align:left;
  font-size:13px;
  opacity:.9;
}

.options label{
  display:block;
  margin-top:8px;
}

.options select,
.options input[type="password"]{

  margin-top:6px;
  padding:10px 12px;
  border-radius:12px;
  border:none;
  outline:none;
  font-size:14px;
}

.options .row{
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:8px;
}

.options .row input[type="checkbox"]{
  transform:scale(1.1);
}

.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.actions button{
  width:100%;
  padding:12px;
  font-size:14px;
  border-radius:12px;
  margin-top:0;

.share-btn{
  background:linear-gradient(135deg,#7CFF6B,#00C6FF);
  color:#001;
  font-weight:bold;
}

.preview-btn{
  background:linear-gradient(135deg,#FFD36B,#FF7A00);
  color:#111;
  font-weight:bold;
}
/* ======= /ADICIONADO ======= */


/* ======= ADICIONADO (CHUVA CYBERPUNK) ======= */
#rain{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
  opacity:.45;
  filter: blur(.2px);
}

.box, .top-controls{
  position:relative;
  z-index:2;
}
/* ======= /ADICIONADO ======= */


/* ======= ADICIONADO (animações) ======= */
.box{
  transform: translateY(10px);
  opacity: 0;
  transition: transform .35s ease, opacity .35s ease;
  will-change: transform, opacity;
}
.box.show{
  transform: translateY(0);
  opacity: 1;
}

button{
  position: relative;
  overflow: hidden;
}
button:active{ transform: scale(.98); }

button::after{
  content:"";
  position:absolute;
  width:10px;height:10px;
  left:50%;top:50%;
  transform:translate(-50%,-50%) scale(1);
  background: rgba(255,255,255,.35);
  border-radius:999px;
  opacity:0;
  pointer-events:none;
}
button.ripple::after{
  animation:ripple .55s ease-out;
}
@keyframes ripple{
  0%{ opacity:.55; transform:translate(-50%,-50%) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(26); }
}

@keyframes shake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-8px); }
  40%{ transform:translateX(8px); }
  60%{ transform:translateX(-6px); }
  80%{ transform:translateX(6px); }
}
.shake{ animation: shake .35s ease; }

@keyframes reveal{
  from{ opacity:0; transform: translateY(10px); }
  to{ opacity:1; transform: translateY(0); }
}
.reveal{ animation: reveal .35s ease; }

@media (prefers-reduced-motion: reduce){
  .box, .box.show, .reveal, .shake, button.ripple::after{
    animation:none !important;
    transition:none !important;
  }
}

/* ✅ FIX MOBILE: botões 🌓🌐 voltam pro canto certo */
.top-controls{
  position: fixed !important;
  top: 15px !important;
  right: 15px !important;
  left: auto !important;
  bottom: auto !important;
  z-index: 9999 !important;
}


/* ======= ADICIONADO (BOTÕES FLUTUANTES + TOASTS) ======= */
.float-status{
  position:fixed;
  left:14px;
  bottom:14px;
  z-index:9999;

  gap:10px;
  align-items:center;

.toast-wrap{

  left:50%;

  display:flex;
  flex-direction:column;
  gap:10px;
  width:min(360px, calc(100vw - 24px));

.toast{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:12px 14px;
  border-radius:16px;
  font-size:13.5px;

  transform: translateY(8px);

}
body.light .toast{

  background: rgba(255,255,255,.88);

.toast.show{ opacity:1; transform: translateY(0); }
.toast.success{ border-color: rgba(34,197,94,.35); }
.toast.warn{ border-color: rgba(245,158,11,.40); }

// ======= TOASTS + STATUS ONLINE =======
const toastWrap = document.getElementById("toastWrap");
function showToast(type, message){
  if(!toastWrap) return;
  const el = document.createElement("div");
  el.className = "toast " + (type || "success");
  el.textContent = message;
  toastWrap.appendChild(el);
  requestAnimationFrame(()=> el.classList.add("show"));
  const ttl = 2200;
  setTimeout(()=>{ el.classList.remove("show"); }, ttl);
  setTimeout(()=>{ el.remove(); }, ttl + 260);
}

function updateOnlineStatus(){
  const dot = document.getElementById("onlineDot");
  const text = document.getElementById("onlineText");
  if(!dot || !text) return;
  const online = navigator.onLine;
  dot.classList.toggle("off", !online);
  const t = texts[lang];
  text.textContent = online ? (t.online || "Online") : (t.offline || "Offline");
}
window.addEventListener("online", updateOnlineStatus);
window.addEventListener("offline", updateOnlineStatus);
updateOnlineStatus();

const params=new URLSearchParams(location.search);
const id=params.get("id");
const create=document.getElementById("create");
const breaker=document.getElementById("breaker");
const view=document.getElementById("view");
const msg=document.getElementById("message");
const timeEl=document.getElementById("destroyTime");
const flash=document.getElementById("flash");

function showBox(el){
  [create, breaker, view].forEach(b=>{
    b.classList.remove("show");
    b.style.display="none";
  });
  el.style.display="block";
  requestAnimationFrame(()=> el.classList.add("show"));
}

document.querySelectorAll("button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    btn.classList.remove("ripple");
    void btn.offsetWidth;
    btn.classList.add("ripple");
  });
});

if(id){
  showBox(breaker);
}else{
  showBox(create);
}

function formatDate(ts){
  const d=new Date(ts);
  return d.toLocaleDateString()+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

window.breakNote=async()=>{
  flash.classList.add("active");
  setTimeout(async()=>{
    showBox(view);
    msg.classList.add("reveal");
    flash.classList.remove("active");

    const ref=doc(db,"notes",id);
    const snap=await getDoc(ref);
    const now=Date.now();

    if(!snap.exists()){
      msg.innerText="❌";
      timeEl.innerText="";
      showToast("danger", texts[lang].noteBroken);
    }else{
      const data = snap.data() || {};
      const raw = data.text || "";

      if(typeof data.expiresAt === "number" && now > data.expiresAt){
        msg.innerText="⏳";
        timeEl.innerText="";
        showToast("warn", texts[lang].noteExpired);
        await deleteDoc(ref);
        showToast("danger", texts[lang].noteBroken);
        return;
      }

      if(data.passHash){
        const promptText = (lang==="pt")
          ? "Digite a senha para abrir a nota:"
          : "Enter the password to open the note:";
        const entered = prompt(promptText) || "";
        const enteredHash = await sha256Hex(entered);

        if(enteredHash !== data.passHash){
          msg.innerText = (lang==="pt") ? "🔒 Senha incorreta." : "🔒 Wrong password.";
          timeEl.innerText = "";
          return;
        }
      }

      msg.innerHTML = DOMPurify.sanitize(raw, {
        USE_PROFILES: { html: true },
        ALLOWED_TAGS: [
          "b","strong","i","em","u","s",
          "p","br","hr","blockquote",
          "h1","h2","h3","h4",
          "ul","ol","li",
          "a","span","div",
          "img"
        ],
        ALLOWED_ATTR: [
          "href","title","target","rel",
          "src","alt","width","height",
          "style","loading","referrerpolicy"
        ]
      });

      timeEl.innerText=texts[lang].destroyed+formatDate(now);

      if(data.oneTime !== false){
        await deleteDoc(ref);
      }
    }
  },500);
};

window.createNote=async()=>{
  const text=document.getElementById("text").value.trim();

  if(!text){
    create.classList.remove("shake");
    void create.offsetWidth;
    create.classList.add("shake");
    return;
  }

  const expireMs = parseInt(document.getElementById("expire").value, 10);
  const oneTime = document.getElementById("oneTime").checked;
  const pass = document.getElementById("pass").value || "";

  const id=Math.random().toString(36).substring(2,10);

  const payload = {
    text,
    createdAt: Date.now(),
    oneTime,
    expiresAt: Date.now() + (isNaN(expireMs) ? 86400000 : expireMs)
  };

  if(pass.trim()){
    payload.passHash = await sha256Hex(pass.trim());
  }

  await setDoc(doc(db,"notes",id), payload);

  const url = `${location.origin}${location.pathname}?id=${id}`;
  document.getElementById("result").innerText = url;
  document.getElementById("linkBox").style.display="block";
  showToast("success", texts[lang].noteCreated);
};

window.copyLink=()=>{
  const resultEl = document.getElementById("result");
  navigator.clipboard.writeText(resultEl.innerText);
  showToast("success", texts[lang].linkCopied);
};

window.shareLink=async()=>{
  const url = document.getElementById("result").innerText;

  if(navigator.share){
    try{
      await navigator.share({ title: "Privinote", text: "Link secreto:", url });
      return;
    }catch(e){}
  }

  await navigator.clipboard.writeText(url);
  showToast("success", texts[lang].linkCopied);
};

window.previewLink=()=>{
  const url = document.getElementById("result").innerText;
  if(url) window.open(url, "_blank", "noopener,noreferrer");
};

window.goCreate=()=>location.href=location.pathname;


// ======= CHUVA CYBERPUNK (OTIMIZADA) + RELÂMPAGO SUAVE =======
const rainCanvas = document.getElementById("rain");
const rctx = rainCanvas.getContext("2d");

// Pausa quando a aba/app não está visível (evita lag no retorno)
let running = true;
document.addEventListener("visibilitychange", ()=>{
  running = !document.hidden;
});

// Reduz resolução do canvas (muito importante no celular)
function resizeRain(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5); // limita DPR
  rainCanvas.width = Math.floor(innerWidth * dpr);
  rainCanvas.height = Math.floor(innerHeight * dpr);
  rainCanvas.style.width = innerWidth + "px";
  rainCanvas.style.height = innerHeight + "px";
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeRain();
addEventListener("resize", resizeRain);

// Menos gotas no mobile
const isMobile = matchMedia("(max-width: 520px)").matches;
const DROP_COUNT = isMobile ? 85 : 140;

const drops = [];
for(let i=0;i<DROP_COUNT;i++){
  drops.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    l: Math.random() * 18 + 8,
    s: Math.random() * 6 + 3,
    w: Math.random() * 1.2 + 0.4,
    a: Math.random() * 0.35 + 0.15,
    // menos glow (mais leve)
    glow: Math.random() > 0.88
  });
}

// relâmpago suave
let lightning = 0;
let nextLightning = Date.now() + (2500 + Math.random()*4500);

function maybeLightning(){
  const now = Date.now();
  if(now > nextLightning){
    lightning = 0.55 + Math.random()*0.35;
    nextLightning = now + (2500 + Math.random()*4500);
  }
  lightning *= 0.92;
  if(lightning < 0.01) lightning = 0;
}

function rain(){
  requestAnimationFrame(rain);
  if(!running) return;

  rctx.clearRect(0,0,innerWidth,innerHeight);

  maybeLightning();
  if(lightning > 0){
    rctx.save();
    rctx.globalAlpha = lightning * 0.22;
    rctx.fillStyle = "#bfefff";
    rctx.fillRect(0,0,innerWidth,innerHeight);
    rctx.restore();
  }

  for(const d of drops){
    rctx.beginPath();
    rctx.globalAlpha = d.a;

    rctx.strokeStyle = d.glow ? "#00ffcc" : "#00c6ff";
    rctx.lineWidth = d.w;

    if(d.glow){
      rctx.shadowColor = "#00c6ff";
      rctx.shadowBlur = 5; // menor = mais leve
    }else{
      rctx.shadowBlur = 0;
    }

    rctx.moveTo(d.x, d.y);
    rctx.lineTo(d.x + d.w, d.y + d.l);
    rctx.stroke();

    d.y += d.s;
    d.x += 0.4;

    if(d.y > innerHeight + 40){
      d.y = -20;
      d.x = Math.random() * innerWidth;
    }
    if(d.x > innerWidth + 40){
      d.x = -20;
    }
  }
}
rain();
</script>
