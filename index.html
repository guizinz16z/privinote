<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Privinote — Mensagem Secreta</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #0e1a22;
  --card: #111d26;
  --accent: #4da3ff;
  --text: #ffffff;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(120deg,#0e1a22,#1b3442);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

.card {
  background: var(--card);
  width: 90%;
  max-width: 420px;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
  animation: fadeIn .5s ease;
}

h2 {
  text-align: center;
  margin-bottom: 15px;
}

textarea {
  width: 100%;
  height: 140px;
  border-radius: 12px;
  border: none;
  padding: 12px;
  font-size: 16px;
  outline: none;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg,#4da3ff,#2b78ff);
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover { opacity: .9 }

#linkBox {
  display: none;
  margin-top: 15px;
}

#linkBox input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

.small {
  text-align: center;
  font-size: 13px;
  opacity: .6;
  margin-top: 10px;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(10px)}
  to {opacity:1; transform:none}
}
</style>
</head>

<body>

<div class="card">
  <h2>🔐 Criar mensagem secreta</h2>

  <textarea id="msg" placeholder="Digite sua mensagem secreta..."></textarea>

  <button onclick="criar()">Criar link secreto</button>

  <div id="linkBox">
    <input id="link" readonly>
    <button onclick="copiar()">📋 Copiar link</button>
  </div>

  <div class="small">Criado por <a href="https://t.me/Guizin16z" target="_blank">@Guizin16z</a></div>
</div>

<script>
function criar() {
  const msg = document.getElementById("msg").value.trim();
  if(!msg) return alert("Digite uma mensagem");

  const id = Math.random().toString(36).substring(2,10);
  localStorage.setItem("note_"+id, msg);

  const url = location.origin + location.pathname.replace("index.html","") + "view.html?id=" + id;

  document.getElementById("link").value = url;
  document.getElementById("linkBox").style.display = "block";
}

function copiar() {
  navigator.clipboard.writeText(document.getElementById("link").value);
  alert("Link copiado!");
}
</script>

</body>
</html>
