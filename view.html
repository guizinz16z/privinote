<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Privinote — Quebrar Nota</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  min-height:100vh;
  background: linear-gradient(120deg,#0e1a22,#1b3442);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial;
  color:#fff;
}

.card {
  background:#111d26;
  width:90%;
  max-width:420px;
  padding:25px;
  border-radius:18px;
  text-align:center;
  animation: fade .4s ease;
}

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#ff5252,#ff1744);
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.msg {
  white-space:pre-wrap;
  background:#0e1a22;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  animation: reveal .4s ease;
}

a {
  display:block;
  margin-top:15px;
  color:#4da3ff;
  text-decoration:none;
}

@keyframes fade {
  from {opacity:0; transform:scale(.95)}
  to {opacity:1}
}

@keyframes reveal {
  from {opacity:0; transform:translateY(10px)}
  to {opacity:1}
}
</style>
</head>

<body>

<div class="card" id="box">
  <h2>🔓 Quebrar nota</h2>
  <button onclick="quebrar()">Quebrar nota</button>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");

function quebrar() {
  if(!id) return alert("Nota inválida");

  const key = "note_"+id;
  const msg = localStorage.getItem(key);

  if(!msg) {
    document.getElementById("box").innerHTML = "<h3>❌ Nota já foi quebrada</h3><a href='index.html'>Criar nova nota</a>";
    return;
  }

  localStorage.removeItem(key);

  document.getElementById("box").innerHTML = `
    <h2>📩 Mensagem</h2>
    <div class="msg">${msg}</div>
    <a href="index.html">➕ Criar nova nota</a>
  `;
}
</script>

</body>
</html>
