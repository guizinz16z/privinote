<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Como usar • Privinote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg-dark:linear-gradient(135deg,#0f2027,#203a43,#2c5364);--bg-light:linear-gradient(135deg,#f5f7fa,#c3cfe2);--box-dark:rgba(0,0,0,.65);--box-light:rgba(255,255,255,.92);--text-dark:#fff;--text-light:#111;--accent:#00c6ff;}
    *{box-sizing:border-box}
    body{margin:0;padding:16px;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg-dark);color:var(--text-dark);min-height:100vh;display:flex;align-items:center;justify-content:center;transition:.3s}
    body.light{background:var(--bg-light);color:var(--text-light)}
    .top-controls{position:fixed;top:15px;right:15px;display:flex;gap:8px}
    .top-controls button{width:auto;padding:8px 12px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;font-weight:700}
    .card{background:var(--box-dark);padding:22px;border-radius:20px;max-width:520px;width:100%;box-shadow:0 25px 50px rgba(0,0,0,.45)}
    body.light .card{background:var(--box-light)}
    h1{margin:0 0 10px;font-size:20px}
    h2{margin:16px 0 8px;font-size:16px}
    p,li{font-size:14px;line-height:1.45;opacity:.92}
    ul{margin:8px 0 0 18px}
    .back{display:block;text-align:center;margin-top:16px;padding:12px;border-radius:14px;text-decoration:none;font-weight:800;color:#fff;background:linear-gradient(135deg,#00c6ff,#0072ff)}
    body.light .back{color:#fff}
  </style>
</head>
<body>
  <div class="top-controls">
    <button onclick="toggleTheme()">🌓</button>
    <button onclick="toggleLang()">🌐</button>
  </div>

  <div class="card">
    <h1 id="t_title">📘 Como usar</h1>

    <h2 id="t_h2_1">1) Criar uma nota</h2>
    <ul>
      <li id="t_1a"></li>
      <li id="t_1b"></li>
      <li id="t_1c"></li>
    </ul>

    <h2 id="t_h2_2">2) Enviar o link</h2>
    <ul>
      <li id="t_2a"></li>
      <li id="t_2b"></li>
    </ul>

    <h2 id="t_h2_3">🔒 Privacidade</h2>
    <ul>
      <li id="t_3a"></li>
      <li id="t_3b"></li>
      <li id="t_3c"></li>
    </ul>

    <h2 id="t_h2_4">⚠️ Observações</h2>
    <ul>
      <li id="t_4a"></li>
      <li id="t_4b"></li>
    </ul>

    <a class="back" href="index.html" id="t_back">⬅️ Voltar</a>
  </div>

  <script>
    const texts={
      pt:{
        title:"📘 Como usar",
        h21:"1) Criar uma nota",
        a1:"Digite sua mensagem e escolha o tempo de expiração.",
        b1:"Marque 'Abrir apenas 1 vez' se quiser que apague após ler.",
        c1:"Senha é opcional: só abre com a senha certa.",
        h22:"2) Enviar o link",
        a2:"Clique em 'Copiar link' ou 'Compartilhar'.",
        b2:"O botão 'Pré-visualizar' mostra a nota sem quebrar.",
        h23:"🔒 Privacidade",
        a3:"A nota expira automaticamente no tempo escolhido.",
        b3:"Se '1 vez' estiver marcado, ela pode sumir após abrir.",
        c3:"Não compartilhe a senha no mesmo lugar do link.",
        h24:"⚠️ Observações",
        a4:"Se você clicar em 'Quebrar nota', ela pode ser destruída.",
        b4:"Não use para atividades ilegais.",
        back:"⬅️ Voltar"
      },
      en:{
        title:"📘 How it works",
        h21:"1) Create a note",
        a1:"Type your message and choose an expiration time.",
        b1:"Enable 'Open only once' to delete after reading.",
        c1:"Password is optional: it only opens with the correct password.",
        h22:"2) Send the link",
        a2:"Tap 'Copy link' or 'Share'.",
        b2:"The 'Preview' button shows the note without breaking it.",
        h23:"🔒 Privacy",
        a3:"The note expires automatically after the chosen time.",
        b3:"If 'one time' is enabled, it may disappear after opening.",
        c3:"Don't share the password in the same place as the link.",
        h24:"⚠️ Notes",
        a4:"If you press 'Break note', it can be destroyed.",
        b4:"Do not use for illegal activities.",
        back:"⬅️ Back"
      }
    };

    let lang = localStorage.getItem('lang') || 'pt';

    function applyLang(){
      const t=texts[lang];
      document.documentElement.lang = lang==='pt' ? 'pt-BR' : 'en';
      document.getElementById('t_title').innerText=t.title;
      document.getElementById('t_h2_1').innerText=t.h21;
      document.getElementById('t_1a').innerText=t.a1;
      document.getElementById('t_1b').innerText=t.b1;
      document.getElementById('t_1c').innerText=t.c1;
      document.getElementById('t_h2_2').innerText=t.h22;
      document.getElementById('t_2a').innerText=t.a2;
      document.getElementById('t_2b').innerText=t.b2;
      document.getElementById('t_h2_3').innerText=t.h23;
      document.getElementById('t_3a').innerText=t.a3;
      document.getElementById('t_3b').innerText=t.b3;
      document.getElementById('t_3c').innerText=t.c3;
      document.getElementById('t_h2_4').innerText=t.h24;
      document.getElementById('t_4a').innerText=t.a4;
      document.getElementById('t_4b').innerText=t.b4;
      document.getElementById('t_back').innerText=t.back;
    }

    window.toggleLang=()=>{
      lang = lang==='pt' ? 'en' : 'pt';
      localStorage.setItem('lang',lang);
      applyLang();
    };

    window.toggleTheme=()=>{
      document.body.classList.toggle('light');
      localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');
    };

    if(localStorage.getItem('theme')==='light') document.body.classList.add('light');
    applyLang();
  </script>
</body>
</html>
