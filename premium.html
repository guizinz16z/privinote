<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nota Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#1f4037,#99f2c8);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  background:rgba(255,255,255,.95);
  padding:26px;
  border-radius:20px;
  max-width:420px;
  width:100%;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.35);
  animation:slide .5s ease;
}

@keyframes slide{
  from{transform:translateY(30px);opacity:0}
  to{transform:none;opacity:1}
}

input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:15px;
  margin-top:10px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
  margin-top:12px;
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  color:#fff;
  transition:.25s;
}

button:hover{
  transform:scale(1.05);
}

.back{
  background:#444;
}

.footer{
  margin-top:18px;
  font-size:12px;
  opacity:.7;
}
</style>
</head>

<body>

<div class="box">
  <h2>⭐ Criar Nota Premium</h2>

  <input placeholder="Mensagem do prêmio">
  <input placeholder="URL da imagem (opcional)">
  <input placeholder="Link do botão (Telegram)">

  <button>Gerar nota premium</button>

  <button class="back" onclick="location.href='index.html'">
    ⬅ Voltar
  </button>

  <div class="footer">
    Criado por <b>@Guizin16z</b>
  </div>
</div>

</body>
</html>
