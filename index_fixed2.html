<style>
:root{
  --bg-dark: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  --bg-light: linear-gradient(135deg,#f5f7fa,#c3cfe2);
  --box-dark: rgba(0,0,0,.65);
  --box-light: rgba(255,255,255,.92);
  --text-dark:#fff;
  --text-light:#111;
  --accent:#00c6ff;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:16px;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg-dark);
  color:var(--text-dark);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.4s;
}

body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

.box{
  background:var(--box-dark);
  padding:26px;
  border-radius:20px;
  max-width:440px;
  width:100%;
  text-align:center;
  box-shadow:0 25px 50px rgba(0,0,0,.45);
  animation:slide .5s ease;
}

body.light .box{background:var(--box-light);}

@keyframes slide{
  from{transform:translateY(30px);opacity:0}
  to{transform:none;opacity:1}
}

textarea{
  width:100%;
  height:120px;
  border-radius:14px;
  border:none;
  padding:14px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
  transition:.25s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.danger{
  background:linear-gradient(135deg,#ff416c,#ff4b2b);
  font-weight:bold;
}

.copy-btn{
  background:#00ffcc;
  color:#000;
  font-weight:bold;
}

.link{
  word-break:break-all;
  font-size:14px;
  color:#00ffcc;
  margin-top:12px;
}

.footer{
  margin-top:18px;
  font-size:12px;
  opacity:.75;
}

.footer a{color:var(--accent);text-decoration:none;font-weight:bold}

.legal{font-size:11px;opacity:.55;margin-top:6px}

.top-controls{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  gap:8px;
}

.top-controls button{
  width:auto;
  padding:8px 12px;
  font-size:14px;
  border-radius:10px;
}

.flash{
  position:fixed;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

.flash.active{animation:flash .5s}

@keyframes flash{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

.time{
  margin-top:12px;
  font-size:13px;
  opacity:.75;
}

/* ======= (opções 2 e 3) ======= */
.options{
  margin-top:10px;
  text-align:left;
  font-size:13px;
  opacity:.9;
}

.options label{
  display:block;
  margin-top:8px;

.options select,
.options input[type="password"]{
  width:100%;
  margin-top:6px;
  padding:10px 12px;
  border-radius:12px;
  border:none;
  outline:none;

.options .row{

  gap:10px;

}

.options .row input[type="checkbox"]{

.actions{

  margin-top:10px;
}

.actions button{

  padding:12px;
  font-size:14px;
  border-radius:12px;
  margin-top:0;
}

.share-btn{
  background:linear-gradient(135deg,#7CFF6B,#00C6FF);

}

.preview-btn{

  font-weight:bold;

/* ADICIONADO: botão limpar */
.clear-btn{
  background:linear-gradient(135deg,#ff5f6d,#ffc371);
  color:#111;
  font-weight:bold;
}

/* ======= CHUVA CYBERPUNK ======= */
#rain{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
  opacity:.45;
  filter: blur(.2px);
}

.box, .top-controls{
  position:relative;
  z-index:2;
}

/* ======= animações ======= */
.box{
  transform: none;
  opacity: 1;
  transition: transform .35s ease, opacity .35s ease;
  will-change: transform, opacity;
}
.box.show{
  transform: translateY(0);
  opacity: 1;
}

button{
  position: relative;
  overflow: hidden;
}
button:active{ transform: scale(.98); }

button::after{
  content:"";
  position:absolute;
  width:10px;height:10px;
  left:50%;top:50%;
  transform:translate(-50%,-50%) scale(1);
  background: rgba(255,255,255,.35);
  border-radius:999px;
  opacity:0;
  pointer-events:none;
}
button.ripple::after{
  animation:ripple .55s ease-out;
}
@keyframes ripple{
  0%{ opacity:.55; transform:translate(-50%,-50%) scale(1); }
  100%{ opacity:0; transform:translate(-50%,-50%) scale(26); }
}

@keyframes shake{
  0%,100%{ transform:translateX(0); }
  20%{ transform:translateX(-8px); }
  40%{ transform:translateX(8px); }
  60%{ transform:translateX(-6px); }
  80%{ transform:translateX(6px); }
}
.shake{ animation: shake .35s ease; }

@keyframes reveal{
  from{ opacity:0; transform: translateY(10px); }
  to{ opacity:1; transform: translateY(0); }
}
.reveal{ animation: reveal .35s ease; }

@media (prefers-reduced-motion: reduce){
  .box, .box.show, .reveal, .shake, button.ripple::after{
    animation:none !important;
    transition:none !important;
  }
}

/* FIX MOBILE: botões canto certo */
.top-controls{
  position: fixed !important;
  top: 15px !important;
  right: 15px !important;
  left: auto !important;
  bottom: auto !important;
  z-index: 9999 !important;

/* ADICIONADO: Toast */
.toast{
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  background: rgba(0,0,0,.78);
  color: #fff;
  padding: 10px 14px;
  border-radius: 14px;

  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show{

body.light .toast{ background: rgba(20,20,20,.85); }

  text-decoration:none;

  display:block;

.history .muted{ opacity:.7; }
</style>

function formatDate(ts){
  const d=new Date(ts);
  return d.toLocaleDateString()+" "+d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ===== ADICIONADO: histórico local ===== */
function loadHistory(){
  const listEl=document.getElementById("historyList");
  const box=document.getElementById("historyBox");
  let items=[];
  try{ items = JSON.parse(localStorage.getItem("history_links")||"[]"); }catch(e){}
  if(!Array.isArray(items) || items.length===0){
    box.style.display="none";
    return;
  }
  box.style.display="block";
  listEl.innerHTML="";
  items.slice(0,5).forEach(url=>{
    const a=document.createElement("a");
    a.href=url;
    a.target="_blank";
    a.rel="noopener noreferrer";
    a.textContent=url;
    listEl.appendChild(a);
  });
}
function addHistory(url){
  let items=[];
  try{ items = JSON.parse(localStorage.getItem("history_links")||"[]"); }catch(e){}
  if(!Array.isArray(items)) items=[];
  items = items.filter(x=>x!==url);
  items.unshift(url);
  items = items.slice(0,10);
  localStorage.setItem("history_links", JSON.stringify(items));
  loadHistory();
}

/* ===== BREAK com confirmação ===== */
window.breakNote=async()=>{
  await firebaseReady;
  if(!db){
    showToast(lang==="pt"?"Falha ao carregar Firebase":"Failed to load Firebase");
    return;
  }
  const ok = confirm(texts[lang].confirmBreak);
  if(!ok) return;

  flash.classList.add("active");
  setTimeout(async()=>{
    showBox(view);
    msg.classList.add("reveal");
    flash.classList.remove("active");

    let ref, snap, now;
    try{
      ref=doc(db,"notes",id);
      snap=await getDoc(ref);
      now=Date.now();
    }catch(err){
      console.error(err);
      const msg = (err && (err.message || err.code)) || String(err);
      msg && showToast((lang==="pt"?"Erro ao carregar nota: ":"Load error: ") + msg);
      msg && (timeEl.innerText="");
      return;
    }

    if(!snap.exists()){
      msg.innerText="❌";
      timeEl.innerText="";
      document.getElementById("openExpireInfo").innerText="";
      showToast("❌");
    }else{
      const data = snap.data() || {};
      const raw = data.text || "";

      // Expiração
      if(typeof data.expiresAt === "number"){
        document.getElementById("openExpireInfo").innerText = texts[lang].expiresAt + formatDate(data.expiresAt);
      }else{
        document.getElementById("openExpireInfo").innerText = "";
      }

      if(typeof data.expiresAt === "number" && now > data.expiresAt){
        msg.innerText="⏳";
        timeEl.innerText="";
        try{ await deleteDoc(ref); }catch(err){ console.error(err); }
        showToast("⏳");
        return;
      }

      // Senha
      if(data.passHash){
        const promptText = (lang==="pt")
          ? "Digite a senha para abrir a nota:"
          : "Enter the password to open the note:";
        const entered = prompt(promptText) || "";
        const enteredHash = await sha256Hex(entered);

        if(enteredHash !== data.passHash){
          msg.innerText = (lang==="pt") ? "🔒 Senha incorreta." : "🔒 Wrong password.";
          timeEl.innerText = "";
          showToast((lang==="pt") ? "🔒 Senha incorreta" : "🔒 Wrong password");
          return;
        }
      }

      msg.innerHTML = DOMPurify.sanitize(raw, {
        USE_PROFILES: { html: true },
        ALLOWED_TAGS: [
          "b","strong","i","em","u","s",
          "p","br","hr","blockquote",
          "h1","h2","h3","h4",
          "ul","ol","li",
          "a","span","div",
          "img"
        ],
        ALLOWED_ATTR: [
          "href","title","target","rel",
          "src","alt","width","height",
          "style","loading","referrerpolicy"
        ]
      });

      timeEl.innerText=texts[lang].destroyed+formatDate(now);

      // Abrir 1 vez
      if(data.oneTime !== false){
        try{ await deleteDoc(ref); }catch(err){ console.error(err); }
      }
    }
  },500);
};

window.createNote=async()=>{
  await firebaseReady;
  if(!db){
    showToast(lang==="pt"?"Falha ao carregar Firebase":"Failed to load Firebase");
    return;
  }
  const text=document.getElementById("text").value.trim();
  if(!text){
    create.classList.remove("shake");
    void create.offsetWidth;
    create.classList.add("shake");
    return;
  }

  const expireMs = parseInt(document.getElementById("expire").value, 10);
  const oneTime = document.getElementById("oneTime").checked;
  const pass = document.getElementById("pass").value || "";

  const id=Math.random().toString(36).substring(2,10);

  const expiresAt = Date.now() + (isNaN(expireMs) ? 86400000 : expireMs);

  const payload = {
    text,
    createdAt: Date.now(),
    oneTime,
    expiresAt
  };

  if(pass.trim()){
    payload.passHash = await sha256Hex(pass.trim());
  }
  try{

  
    await setDoc(doc(db,"notes",id), payload);
  
    const url = `${location.origin}${location.pathname}?id=${id}`;
    document.getElementById("result").innerText = url;
    document.getElementById("createdExpireInfo").innerText = texts[lang].expiresAt + formatDate(expiresAt);
    document.getElementById("linkBox").style.display="block";
  
    addHistory(url);
    showToast(texts[lang].linkCreated);
  }catch(err){
    console.error(err);
    const msg = (err && (err.message || err.code)) || String(err);
    showToast((lang==="pt"?"Erro ao salvar (Firestore): ":"Save error (Firestore): ") + msg);
  }
};

window.copyLink=async()=>{
  const resultEl = document.getElementById("result");
  const url = resultEl.innerText;
  try{
    await navigator.clipboard.writeText(url);
    showToast(texts[lang].copied);
  }catch(e){
    showToast(texts[lang].copiedFallback);
  }
};

window.shareLink=async()=>{
  const url = document.getElementById("result").innerText;

  if(navigator.share){
    try{
      await navigator.share({ title: "Privinote", text: "Link secreto:", url });
      showToast(texts[lang].shared);
      return;
    }catch(e){}
  }

  try{
    await navigator.clipboard.writeText(url);
    showToast(texts[lang].copiedFallback);
  }catch(e){
    showToast("✅");
  }
};

window.previewLink=()=>{
  const url = document.getElementById("result").innerText;
  if(url) window.open(url, "_blank", "noopener,noreferrer");
};

window.goCreate=()=>location.href=location.pathname;

/* ===== EFEITOS ON/OFF ===== */
const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let effectsEnabled = localStorage.getItem("effects")==="off" ? false : true;
if(prefersReduced) effectsEnabled = false;

function updateFxBtn(){
  const btn=document.getElementById("fxBtn");
  if(!btn) return;
  btn.title = effectsEnabled ? texts[lang].fxOn : texts[lang].fxOff;
  btn.style.opacity = effectsEnabled ? "1" : ".65";
}
window.toggleEffects=()=>{
  effectsEnabled = !effectsEnabled;
  localStorage.setItem("effects", effectsEnabled ? "on" : "off");
  updateFxBtn();
};
updateFxBtn();


/* ======= CHUVA CYBERPUNK (OTIMIZADA) + RELÂMPAGO SUAVE ======= */
const rainCanvas = document.getElementById("rain");
const rctx = rainCanvas.getContext("2d");

let running = true;
document.addEventListener("visibilitychange", ()=>{
  running = !document.hidden;
});

function resizeRain(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  rainCanvas.width = Math.floor(innerWidth * dpr);
  rainCanvas.height = Math.floor(innerHeight * dpr);
  rainCanvas.style.width = innerWidth + "px";
  rainCanvas.style.height = innerHeight + "px";
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeRain();
addEventListener("resize", resizeRain);

const isMobile = matchMedia("(max-width: 520px)").matches;
const DROP_COUNT = isMobile ? 85 : 140;

const drops = [];
for(let i=0;i<DROP_COUNT;i++){
  drops.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    l: Math.random() * 18 + 8,
    s: Math.random() * 6 + 3,
    w: Math.random() * 1.2 + 0.4,
    a: Math.random() * 0.35 + 0.15,
    glow: Math.random() > 0.88
  });
}

let lightning = 0;
let nextLightning = Date.now() + (2500 + Math.random()*4500);

function maybeLightning(){
  const now = Date.now();
  if(now > nextLightning){
    lightning = 0.55 + Math.random()*0.35;
    nextLightning = now + (2500 + Math.random()*4500);
  }
  lightning *= 0.92;
  if(lightning < 0.01) lightning = 0;
}

function rain(){
  requestAnimationFrame(rain);
  if(!running) return;

  if(!effectsEnabled){
    rctx.clearRect(0,0,innerWidth,innerHeight);
    return;
  }

  rctx.clearRect(0,0,innerWidth,innerHeight);

  maybeLightning();
  if(lightning > 0){
    rctx.save();
    rctx.globalAlpha = lightning * 0.22;
    rctx.fillStyle = "#bfefff";
    rctx.fillRect(0,0,innerWidth,innerHeight);
    rctx.restore();
  }

  for(const d of drops){
    rctx.beginPath();
    rctx.globalAlpha = d.a;

    rctx.strokeStyle = d.glow ? "#00ffcc" : "#00c6ff";
    rctx.lineWidth = d.w;

    if(d.glow){
      rctx.shadowColor = "#00c6ff";
      rctx.shadowBlur = 5;
    }else{
      rctx.shadowBlur = 0;
    }

    rctx.moveTo(d.x, d.y);
    rctx.lineTo(d.x + d.w, d.y + d.l);
    rctx.stroke();

    d.y += d.s;
    d.x += 0.4;

    if(d.y > innerHeight + 40){
      d.y = -20;
      d.x = Math.random() * innerWidth;
    }
    if(d.x > innerWidth + 40){
      d.x = -20;
    }
  }
}
rain();
</script>
